name: awesome-server

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  backend:
    image: slawekradzyminski/backend:3.7.13@sha256:c7c7d3298bd2b140bc1f914c147d1932b6d493d2a16a793a350f3ad9bde6fa69
    restart: unless-stopped
    hostname: backend
    logging: *default-logging
    env_file:
      - path: .env.runtime
        required: false
    environment:
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx896m"
      SPRING_PROFILES_ACTIVE: docker,server
      SPRING_ARTEMIS_BROKER_URL: tcp://activemq:61616
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/testdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      SECURITY_RATE_LIMIT_ENABLED: "true"
      SECURITY_RATE_LIMIT_TRUST_FORWARDED_HEADERS: "true"
      SECURITY_RATE_LIMIT_SIGNUP_IP_CAPACITY: "200"
      SECURITY_RATE_LIMIT_SIGNIN_IP_CAPACITY: "400"
      SECURITY_RATE_LIMIT_SIGNIN_USERNAME_CAPACITY: "200"
      SECURITY_RATE_LIMIT_SIGNIN_IP_USERNAME_CAPACITY: "100"
      SECURITY_RATE_LIMIT_MFA_IP_CAPACITY: "60"
      SECURITY_RATE_LIMIT_MFA_CHALLENGE_CAPACITY: "8"
      SECURITY_RATE_LIMIT_MFA_USER_CAPACITY: "30"
      SECURITY_RATE_LIMIT_PASSWORD_FORGOT_IP_CAPACITY: "200"
      SECURITY_RATE_LIMIT_PASSWORD_FORGOT_IDENTIFIER_CAPACITY: "60"
      SECURITY_RATE_LIMIT_PASSWORD_RESET_IP_CAPACITY: "200"
      SECURITY_RATE_LIMIT_REFRESH_IP_CAPACITY: "1200"
      SECURITY_RATE_LIMIT_EMAIL_USER_CAPACITY: "600"
      SECURITY_RATE_LIMIT_QR_USER_CAPACITY: "1200"
      SECURITY_RATE_LIMIT_OLLAMA_USER_CAPACITY: "400"
      SECURITY_RATE_LIMIT_OLLAMA_IP_CAPACITY: "400"
      OLLAMA_BASE_URL: http://ollama-mock:11434
      PASSWORD_RESET_FRONTEND_BASE_URL: https://awesome.byst.re/reset
      SWAGGER_UI_OAUTH2_REDIRECT_URL: https://awesome.byst.re/swagger-ui/oauth2-redirect.html
      APP_SSO_ENABLED: "false"
      APP_MFA_REQUIRE_SECURE_ENCRYPTION: "true"
      JWT_REQUIRE_SECURE_KEY: "true"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,prometheus
      APP_CORS_ALLOWED_ORIGIN_PATTERNS: http://awesome.byst.re,https://awesome.byst.re,http://localhost:8081,http://127.0.0.1:8081,http://host.docker.internal:8081
    depends_on:
      postgres:
        condition: service_healthy
      activemq:
        condition: service_started
      ollama-mock:
        condition: service_started
    expose:
      - "4001"
    mem_limit: 1536m
    networks:
      - my-private-ntwk

  frontend:
    # Release independently from aitesters-frontend.
    image: slawekradzyminski/frontend:3.7.11@sha256:b1c0bb05b1aaf5ca8e38552dcb137d8ba908975fa1c8c0eb7d80ca003afa03f8
    restart: unless-stopped
    logging: *default-logging
    expose:
      - "80"
    networks:
      - my-private-ntwk

  aitesters-backend:
    image: slawekradzyminski/backend:3.7.9
    restart: unless-stopped
    hostname: aitesters-backend
    logging: *default-logging
    env_file:
      - path: .env.runtime
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: aitesters
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      OLLAMA_BASE_URL: http://ollama-mock:11434
      PASSWORD_RESET_FRONTEND_BASE_URL: https://aitesters.byst.re/reset
      SWAGGER_UI_OAUTH2_REDIRECT_URL: https://aitesters.byst.re/swagger-ui/oauth2-redirect.html
      APP_SSO_ENABLED: "false"
      APP_BOOTSTRAP_ADMIN_ENABLED: "false"
      APP_MFA_REQUIRE_SECURE_ENCRYPTION: "true"
      JWT_REQUIRE_SECURE_KEY: "true"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,prometheus
      SECURITY_RATE_LIMIT_ENABLED: "true"
      SECURITY_RATE_LIMIT_TRUST_FORWARDED_HEADERS: "true"
      SECURITY_RATE_LIMIT_SIGNUP_IP_CAPACITY: "200"
      SECURITY_RATE_LIMIT_SIGNIN_IP_CAPACITY: "400"
      SECURITY_RATE_LIMIT_SIGNIN_USERNAME_CAPACITY: "200"
      SECURITY_RATE_LIMIT_SIGNIN_IP_USERNAME_CAPACITY: "100"
      SECURITY_RATE_LIMIT_MFA_IP_CAPACITY: "60"
      SECURITY_RATE_LIMIT_MFA_CHALLENGE_CAPACITY: "8"
      SECURITY_RATE_LIMIT_MFA_USER_CAPACITY: "30"
      APP_CORS_ALLOWED_ORIGIN_PATTERNS: http://aitesters.byst.re,https://aitesters.byst.re,http://aitesters.awesome.byst.re,https://aitesters.awesome.byst.re
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70 -XX:InitialRAMPercentage=20"
    depends_on:
      ollama-mock:
        condition: service_started
    expose:
      - "4001"
    mem_limit: 768m
    networks:
      - my-private-ntwk

  aitesters-frontend:
    image: slawekradzyminski/frontend:3.7.6
    restart: unless-stopped
    logging: *default-logging
    expose:
      - "80"
    networks:
      - my-private-ntwk

  gateway:
    image: nginx:1.31.2-trixie
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
      aitesters-frontend:
        condition: service_started
      aitesters-backend:
        condition: service_started
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/conf.d/app-gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./images:/usr/share/nginx/html/images:ro
      - ./branding:/usr/share/nginx/html/branding:ro
      - ./nginx/conf.d/header-buffers.conf:/etc/nginx/conf.d/header-buffers.conf:ro
    networks:
      - my-private-ntwk

  edge:
    image: nginx:1.31.2-trixie
    restart: unless-stopped
    network_mode: host
    logging: *default-logging
    depends_on:
      - gateway
    volumes:
      - ./nginx/conf.d/edge-gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/conf.d/header-buffers.conf:/etc/nginx/conf.d/header-buffers.conf:ro

  node-exporter:
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    restart: unless-stopped
    hostname: awesome-server
    logging: *default-logging
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run/credentials/.+|var/lib/docker/.+)($|/)
    pid: host
    read_only: true
    security_opt:
      - no-new-privileges:true
    volumes:
      - /:/host:ro,rslave
    expose:
      - "9100"
    mem_limit: 64m
    networks:
      - my-private-ntwk

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.5@sha256:763aecf1c32c2be8a1a75f9abfc2fc461005c9dbbaa39cb356b354aac1296dbe
    restart: unless-stopped
    logging: *default-logging
    privileged: true
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --store_container_labels=false
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    expose:
      - "8080"
    mem_limit: 256m
    networks:
      - my-private-ntwk

  alertmanager:
    image: prom/alertmanager:v0.32.1@sha256:51a825c2a40acc3e338fdd00d622e01ec090f72be2b3ea46be0839cd47a4d286
    restart: unless-stopped
    logging: *default-logging
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --cluster.listen-address=
      - --enable-feature=utf8-strict-mode
    volumes:
      - ./alertmanager/:/etc/alertmanager/:ro
      - alertmanager-data:/alertmanager
    expose:
      - "9093"
    mem_limit: 128m
    read_only: true
    security_opt:
      - no-new-privileges:true
    networks:
      - my-private-ntwk

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.28.0@sha256:e753ff9f3fc458d02cca5eddab5a77e1c175eee484a8925ac7d524f04366c2fc
    restart: unless-stopped
    logging: *default-logging
    command:
      - --config.file=/etc/blackbox_exporter/blackbox.yml
      - --log.prober=warn
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/blackbox.yml:ro
    expose:
      - "9115"
    mem_limit: 64m
    read_only: true
    user: "65534:65534"
    security_opt:
      - no-new-privileges:true
    networks:
      - my-private-ntwk

  prometheus:
    image: prom/prometheus:v3.13.1@sha256:3c42b892cf723fa54d2f262c37a0e1f80aa8c8ddb1da7b9b0df9455a35a7f893
    restart: unless-stopped
    logging: *default-logging
    command:
      - --config.file=/etc/prometheus/prometheus.server.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=5GB
    volumes:
      - ./prometheus/:/etc/prometheus/:ro
      - prometheus-data:/prometheus
    depends_on:
      - backend
      - consumer
      - node-exporter
      - cadvisor
      - alertmanager
      - blackbox-exporter
    expose:
      - "9090"
    mem_limit: 512m
    networks:
      - my-private-ntwk

  grafana:
    image: grafana/grafana:13.1.1@sha256:7cb8c64c4d57a57e734073f3cc94620adb24a0acb929bd80ba9f14017e3a975b
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - path: .env.runtime
        required: false
    volumes:
      - ./grafana/server-provisioning/datasources/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./grafana/server-provisioning/dashboards/dashboard.yml:/etc/grafana/provisioning/dashboards/dashboard.yml:ro
      - ./grafana/provisioning/dashboards/spring_dashboard.json:/etc/grafana/provisioning/dashboards/spring_dashboard.json:ro
      - ./grafana/provisioning/dashboards/spring_http_dashboard.json:/etc/grafana/provisioning/dashboards/spring_http_dashboard.json:ro
      - ./grafana/provisioning/dashboards/production_resources.json:/etc/grafana/provisioning/dashboards/production_resources.json:ro
      - ./grafana/provisioning/dashboards/production_safeguards.json:/etc/grafana/provisioning/dashboards/production_safeguards.json:ro
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - my-private-ntwk

  postgres:
    image: postgres:16.14-bookworm
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: testdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d testdb"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - my-private-ntwk

  activemq:
    image: apache/activemq-artemis:2.42.0
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - path: .env.runtime
        required: false
    environment:
      ANONYMOUS_LOGIN: "false"
      EXTRA_ARGS: --http-host 0.0.0.0 --relax-jolokia --no-autotune
      BROKER_CONFIG_GLOBAL_MAX_SIZE: 256mb
    expose:
      - "61616"
      - "8161"
    hostname: activemq
    networks:
      - my-private-ntwk

  mailpit:
    image: axllent/mailpit:v1.30.0
    restart: unless-stopped
    logging: *default-logging
    environment:
      MP_DISABLE_VERSION_CHECK: "true"
    ports:
      - "127.0.0.1:8025:8025"
    expose:
      - "1025"
    hostname: mailpit
    networks:
      - my-private-ntwk

  consumer:
    image: slawekradzyminski/consumer:3.3.5@sha256:1da0e051f9fba1492e6597ae385aee64a78ebc434928bddd84bd1fd8a222fe96
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - path: .env.runtime
        required: false
    environment:
      JAVA_TOOL_OPTIONS: "-Xms192m -Xmx768m"
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
    expose:
      - "4002"
    hostname: consumer
    depends_on:
      activemq:
        condition: service_started
      mailpit:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 1152m
    networks:
      - my-private-ntwk

  ollama-mock:
    image: slawekradzyminski/ollama-mock:1.0.7@sha256:623170cfb5bbe18b8584ca3683c69023af2267d3534812136eecef39e10f9872
    restart: unless-stopped
    logging: *default-logging
    expose:
      - "11434"
    networks:
      - my-private-ntwk

volumes:
  postgres-data:
  prometheus-data:
  alertmanager-data:

networks:
  my-private-ntwk:
    driver: bridge
