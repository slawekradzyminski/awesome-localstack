name: awesome-server

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  backend:
    image: slawekradzyminski/backend:3.14.0@sha256:476c7e3bcb6edd65425fb4818411bdd0143347c4af40baff4c94198a5ec288b1
    restart: unless-stopped
    hostname: backend
    logging: *default-logging
    env_file:
      # Supplies JWT_SIGNING_KEY and WAREHOUSE_SERVICE_TOKEN from Ansible Vault.
      - path: .env.runtime
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: docker,server
      SPRING_PROFILES_INCLUDE: graphql,grpc
      GRPC_HOST: 0.0.0.0
      GRPC_PORT: "9091"
      GRPC_REFLECTION_ENABLED: "false"
      SPRING_ARTEMIS_BROKER_URL: tcp://activemq:61616
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/testdb
      SPRING_DATASOURCE_USERNAME: postgres
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      SECURITY_RATE_LIMIT_ENABLED: "true"
      SECURITY_RATE_LIMIT_TRUST_FORWARDED_HEADERS: "true"
      SECURITY_RATE_LIMIT_SIGNUP_IP_CAPACITY: "2000"
      SECURITY_RATE_LIMIT_SIGNIN_IP_CAPACITY: "4000"
      SECURITY_RATE_LIMIT_SIGNIN_USERNAME_CAPACITY: "2000"
      SECURITY_RATE_LIMIT_SIGNIN_IP_USERNAME_CAPACITY: "1000"
      SECURITY_RATE_LIMIT_MFA_IP_CAPACITY: "600"
      SECURITY_RATE_LIMIT_MFA_CHALLENGE_CAPACITY: "80"
      SECURITY_RATE_LIMIT_MFA_USER_CAPACITY: "300"
      SECURITY_RATE_LIMIT_PASSWORD_FORGOT_IP_CAPACITY: "2000"
      SECURITY_RATE_LIMIT_PASSWORD_FORGOT_IDENTIFIER_CAPACITY: "600"
      SECURITY_RATE_LIMIT_PASSWORD_RESET_IP_CAPACITY: "2000"
      SECURITY_RATE_LIMIT_REFRESH_IP_CAPACITY: "12000"
      SECURITY_RATE_LIMIT_EMAIL_USER_CAPACITY: "6000"
      SECURITY_RATE_LIMIT_QR_USER_CAPACITY: "12000"
      SECURITY_RATE_LIMIT_OLLAMA_USER_CAPACITY: "4000"
      SECURITY_RATE_LIMIT_OLLAMA_IP_CAPACITY: "4000"
      OLLAMA_BASE_URL: http://ollama-mock:11434
      PASSWORD_RESET_FRONTEND_BASE_URL: https://awesome.byst.re/reset
      SWAGGER_UI_OAUTH2_REDIRECT_URL: https://awesome.byst.re/swagger-ui/oauth2-redirect.html
      APP_SSO_ENABLED: "false"
      APP_MFA_REQUIRE_SECURE_ENCRYPTION: "true"
      JWT_REQUIRE_SECURE_KEY: "true"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,prometheus
      APP_CORS_ALLOWED_ORIGIN_PATTERNS: http://awesome.byst.re,https://awesome.byst.re,http://localhost:8081,http://127.0.0.1:8081,http://host.docker.internal:8081
    depends_on:
      postgres:
        condition: service_healthy
      activemq:
        condition: service_started
      ollama-mock:
        condition: service_started
    ports:
      - "127.0.0.1:9091:9091"
    expose:
      - "4001"
    # GraalVM native image: no JIT warm-up; the heap cap is a runtime argument.
    command: ["-Xmx384m"]
    mem_limit: 640m
    networks:
      - my-private-ntwk

  warehouse-service:
    image: slawekradzyminski/warehouse-service:1.1.0@sha256:ae39b577695c7383d30e91ff96247c718ca5fce00fea4eff21460e114f17ee77
    restart: unless-stopped
    hostname: warehouse-service
    logging: *default-logging
    env_file:
      # Only WAREHOUSE_SERVICE_TOKEN and the warehouse role's SPRING_DATASOURCE_PASSWORD,
      # rendered by Ansible from Vault. Access tokens are verified with the backend's JWKS.
      - path: .env.warehouse
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/testdb?currentSchema=warehouse
      SPRING_DATASOURCE_USERNAME: warehouse
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,prometheus
      BACKEND_BASE_URL: http://backend:4001
    depends_on:
      postgres-roles:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    expose:
      - "4003"
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/4003;
          printf 'GET /actuator/health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3;
          read -r _ status _ <&3;
          test "$$status" = 200
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    command: ["-Xmx64m"]
    mem_limit: 160m
    networks:
      - my-private-ntwk


  aitesters-warehouse-service:
    # The sandbox's own warehouse-service, paired with aitesters-backend and sharing
    # its database (schema warehouse), like warehouse-service on the stable site.
    image: slawekradzyminski/warehouse-service:1.1.0@sha256:ae39b577695c7383d30e91ff96247c718ca5fce00fea4eff21460e114f17ee77
    restart: unless-stopped
    hostname: aitesters-warehouse-service
    logging: *default-logging
    env_file:
      # Only its own service token and the warehouse role's database password; tokens
      # are verified with aitesters-backend's JWKS, so stable-site tokens never match.
      - path: .env.aitesters-warehouse
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://aitesters-postgres:5432/aitesters?currentSchema=warehouse
      SPRING_DATASOURCE_USERNAME: warehouse
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info
      BACKEND_BASE_URL: http://aitesters-backend:4001
    depends_on:
      aitesters-postgres-roles:
        condition: service_completed_successfully
        restart: true
      aitesters-backend:
        condition: service_healthy
        restart: true
    expose:
      - "4003"
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/4003;
          printf 'GET /actuator/health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3;
          read -r _ status _ <&3;
          test "$$status" = 200
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    command: ["-Xmx64m"]
    mem_limit: 160m
    networks:
      - my-private-ntwk

  postgres-roles:
    # One-shot: gives warehouse-service its own role, limited to schema warehouse of
    # testdb (postgres/warehouse-role.sh). Runs before every warehouse-service start.
    image: postgres:16.14-bookworm@sha256:92620daddcd947f8d5ab5ba66e848702fe443d87fed30c4cea8e389fd78dfc55
    entrypoint: ["bash", "/scripts/warehouse-role.sh"]
    restart: "no"
    logging: *default-logging
    env_file:
      # PGPASSWORD (superuser) and WAREHOUSE_DB_PASSWORD from Ansible Vault.
      - path: .env.postgres-roles
        required: false
    environment:
      PGHOST: postgres
      PGDATABASE: testdb
      PGUSER: postgres
    volumes:
      - ./postgres:/scripts:ro
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 64m
    networks:
      - my-private-ntwk

  aitesters-postgres-roles:
    # The same one-shot for the sandbox database; the nightly reset runs it again
    # after renewing aitesters-postgres.
    image: postgres:16.14-bookworm@sha256:92620daddcd947f8d5ab5ba66e848702fe443d87fed30c4cea8e389fd78dfc55
    entrypoint: ["bash", "/scripts/warehouse-role.sh"]
    restart: "no"
    logging: *default-logging
    env_file:
      - path: .env.aitesters-postgres-roles
        required: false
    environment:
      PGHOST: aitesters-postgres
      PGDATABASE: aitesters
      PGUSER: aitesters
    volumes:
      - ./postgres:/scripts:ro
    depends_on:
      aitesters-postgres:
        condition: service_healthy
        restart: true
    mem_limit: 64m
    networks:
      - my-private-ntwk

  aitesters-postgres:
    # The sandbox database: aitesters-backend (database aitesters) and its warehouse
    # (schema warehouse), mirroring the stable site. Disk-backed through the image's
    # anonymous volume; the nightly reset renews it (--renew-anon-volumes).
    image: postgres:16.14-bookworm@sha256:92620daddcd947f8d5ab5ba66e848702fe443d87fed30c4cea8e389fd78dfc55
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - path: .env.aitesters-postgres
        required: false
    environment:
      POSTGRES_DB: aitesters
      POSTGRES_USER: aitesters
    command:
      - postgres
      - -c
      - shared_buffers=32MB
      - -c
      - max_connections=40
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=16MB
      - -c
      - effective_cache_size=96MB
    expose:
      - "5432"
    mem_limit: 160m
    shm_size: 64m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aitesters -d aitesters"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - my-private-ntwk
  frontend:
    image: slawekradzyminski/frontend:3.11.0@sha256:ee573177bb35f0f32fc152b85c004793d2325c08ad70d35e0c105be8df21b7f0
    restart: unless-stopped
    logging: *default-logging
    expose:
      - "80"
    mem_limit: 64m
    networks:
      - my-private-ntwk

  aitesters-backend:
    image: slawekradzyminski/backend:3.14.0@sha256:476c7e3bcb6edd65425fb4818411bdd0143347c4af40baff4c94198a5ec288b1
    restart: unless-stopped
    hostname: aitesters-backend
    logging: *default-logging
    env_file:
      # Separate runtime file prevents sandbox tokens from authenticating on the stable site.
      - path: .env.aitesters
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: aitesters
      SPRING_DATASOURCE_URL: jdbc:postgresql://aitesters-postgres:5432/aitesters
      SPRING_DATASOURCE_USERNAME: aitesters
      SPRING_PROFILES_INCLUDE: graphql,grpc
      GRPC_HOST: 0.0.0.0
      GRPC_PORT: "9091"
      GRPC_REFLECTION_ENABLED: "false"
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      OLLAMA_BASE_URL: http://ollama-mock:11434
      PASSWORD_RESET_FRONTEND_BASE_URL: https://aitesters.byst.re/reset
      SWAGGER_UI_OAUTH2_REDIRECT_URL: https://aitesters.byst.re/swagger-ui/oauth2-redirect.html
      APP_SSO_ENABLED: "false"
      APP_BOOTSTRAP_ADMIN_ENABLED: "false"
      APP_MFA_REQUIRE_SECURE_ENCRYPTION: "true"
      JWT_REQUIRE_SECURE_KEY: "true"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,prometheus
      SECURITY_RATE_LIMIT_ENABLED: "true"
      SECURITY_RATE_LIMIT_TRUST_FORWARDED_HEADERS: "true"
      SECURITY_RATE_LIMIT_SIGNUP_IP_CAPACITY: "2000"
      SECURITY_RATE_LIMIT_SIGNIN_IP_CAPACITY: "4000"
      SECURITY_RATE_LIMIT_SIGNIN_USERNAME_CAPACITY: "2000"
      SECURITY_RATE_LIMIT_SIGNIN_IP_USERNAME_CAPACITY: "1000"
      SECURITY_RATE_LIMIT_MFA_IP_CAPACITY: "600"
      SECURITY_RATE_LIMIT_MFA_CHALLENGE_CAPACITY: "80"
      SECURITY_RATE_LIMIT_MFA_USER_CAPACITY: "300"
      SECURITY_RATE_LIMIT_PASSWORD_FORGOT_IP_CAPACITY: "100"
      SECURITY_RATE_LIMIT_PASSWORD_FORGOT_IDENTIFIER_CAPACITY: "30"
      SECURITY_RATE_LIMIT_PASSWORD_RESET_IP_CAPACITY: "100"
      SECURITY_RATE_LIMIT_REFRESH_IP_CAPACITY: "600"
      SECURITY_RATE_LIMIT_EMAIL_USER_CAPACITY: "300"
      SECURITY_RATE_LIMIT_QR_USER_CAPACITY: "600"
      SECURITY_RATE_LIMIT_OLLAMA_USER_CAPACITY: "200"
      SECURITY_RATE_LIMIT_OLLAMA_IP_CAPACITY: "200"
      APP_CORS_ALLOWED_ORIGIN_PATTERNS: http://aitesters.byst.re,https://aitesters.byst.re,http://aitesters.awesome.byst.re,https://aitesters.awesome.byst.re
    depends_on:
      aitesters-postgres:
        condition: service_healthy
      ollama-mock:
        condition: service_started
    ports:
      - "127.0.0.1:9092:9091"
    expose:
      - "4001"
    # GraalVM native image: no JIT warm-up; the heap cap is a runtime argument.
    command: ["-Xmx256m"]
    mem_limit: 448m
    networks:
      - my-private-ntwk

  aitesters-frontend:
    image: slawekradzyminski/frontend:3.11.0@sha256:ee573177bb35f0f32fc152b85c004793d2325c08ad70d35e0c105be8df21b7f0
    restart: unless-stopped
    logging: *default-logging
    expose:
      - "80"
    mem_limit: 64m
    networks:
      - my-private-ntwk

  gateway:
    image: nginx:1.31.3-trixie@sha256:5a88c9c45479443d7be2eadc894b4ed0a9801bae03d97a5760ae13b5c2005942
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
      aitesters-frontend:
        condition: service_started
      aitesters-backend:
        condition: service_started
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/conf.d/app-gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./images:/usr/share/nginx/html/images:ro
      - ./branding:/usr/share/nginx/html/branding:ro
      - ./nginx/conf.d/header-buffers.conf:/etc/nginx/conf.d/header-buffers.conf:ro
    mem_limit: 128m
    networks:
      - my-private-ntwk

  edge:
    image: nginx:1.31.3-trixie@sha256:5a88c9c45479443d7be2eadc894b4ed0a9801bae03d97a5760ae13b5c2005942
    restart: unless-stopped
    network_mode: host
    logging: *default-logging
    depends_on:
      - gateway
    volumes:
      - ./nginx/conf.d/edge-gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/conf.d/header-buffers.conf:/etc/nginx/conf.d/header-buffers.conf:ro
    mem_limit: 128m

  node-exporter:
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    restart: unless-stopped
    hostname: awesome-server
    logging: *default-logging
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run/credentials/.+|var/lib/docker/.+)($|/)
    pid: host
    read_only: true
    security_opt:
      - no-new-privileges:true
    volumes:
      - /:/host:ro,rslave
    expose:
      - "9100"
    mem_limit: 64m
    networks:
      - my-private-ntwk

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.5@sha256:763aecf1c32c2be8a1a75f9abfc2fc461005c9dbbaa39cb356b354aac1296dbe
    restart: unless-stopped
    logging: *default-logging
    privileged: true
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --store_container_labels=false
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    expose:
      - "8080"
    mem_limit: 256m
    networks:
      - my-private-ntwk

  alertmanager:
    image: prom/alertmanager:v0.32.1@sha256:51a825c2a40acc3e338fdd00d622e01ec090f72be2b3ea46be0839cd47a4d286
    restart: unless-stopped
    logging: *default-logging
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --cluster.listen-address=
      - --enable-feature=utf8-strict-mode
    volumes:
      - ./alertmanager/:/etc/alertmanager/:ro
      - alertmanager-data:/alertmanager
    expose:
      - "9093"
    mem_limit: 128m
    read_only: true
    security_opt:
      - no-new-privileges:true
    networks:
      - my-private-ntwk

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.28.0@sha256:e753ff9f3fc458d02cca5eddab5a77e1c175eee484a8925ac7d524f04366c2fc
    restart: unless-stopped
    logging: *default-logging
    command:
      - --config.file=/etc/blackbox_exporter/blackbox.yml
      - --log.prober=warn
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/blackbox.yml:ro
    expose:
      - "9115"
    mem_limit: 64m
    read_only: true
    user: "65534:65534"
    security_opt:
      - no-new-privileges:true
    networks:
      - my-private-ntwk

  prometheus:
    image: prom/prometheus:v3.13.2@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69
    restart: unless-stopped
    logging: *default-logging
    command:
      - --config.file=/etc/prometheus/prometheus.server.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=5GB
    volumes:
      - ./prometheus/:/etc/prometheus/:ro
      - prometheus-data:/prometheus
    depends_on:
      - backend
      - consumer
      - node-exporter
      - cadvisor
      - alertmanager
      - blackbox-exporter
    expose:
      - "9090"
    mem_limit: 512m
    networks:
      - my-private-ntwk

  grafana:
    image: grafana/grafana:13.1.1@sha256:7cb8c64c4d57a57e734073f3cc94620adb24a0acb929bd80ba9f14017e3a975b
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - path: .env.runtime
        required: false
    volumes:
      - ./grafana/server-provisioning/datasources/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./grafana/server-provisioning/dashboards/dashboard.yml:/etc/grafana/provisioning/dashboards/dashboard.yml:ro
      - ./grafana/provisioning/dashboards/spring_dashboard.json:/etc/grafana/provisioning/dashboards/spring_dashboard.json:ro
      - ./grafana/provisioning/dashboards/spring_http_dashboard.json:/etc/grafana/provisioning/dashboards/spring_http_dashboard.json:ro
      - ./grafana/provisioning/dashboards/production_resources.json:/etc/grafana/provisioning/dashboards/production_resources.json:ro
      - ./grafana/provisioning/dashboards/production_safeguards.json:/etc/grafana/provisioning/dashboards/production_safeguards.json:ro
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:3000:3000"
    mem_limit: 640m
    networks:
      - my-private-ntwk

  postgres:
    image: postgres:16.14-bookworm@sha256:92620daddcd947f8d5ab5ba66e848702fe443d87fed30c4cea8e389fd78dfc55
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - path: .env.runtime
        required: false
    environment:
      POSTGRES_DB: testdb
      POSTGRES_USER: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d testdb"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 512m
    networks:
      - my-private-ntwk

  activemq:
    image: apache/artemis:2.55.0@sha256:a192eee9c46e6352625ca9dbf0beebe4a34c363111c628bbb10c4aff1227341d
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - path: .env.runtime
        required: false
    environment:
      ANONYMOUS_LOGIN: "false"
      EXTRA_ARGS: --http-host 0.0.0.0 --relax-jolokia --no-autotune --global-max-size 256M
      JAVA_ARGS: >-
        -XX:AutoBoxCacheMax=20000
        -XX:+PrintClassHistogram
        -XX:+UseG1GC
        -XX:+UseStringDeduplication
        -Xms256M
        -Xmx512M
        -Dhawtio.disableProxy=true
        -Dhawtio.realm=activemq
        -Dhawtio.offline=true
        -Dhawtio.rolePrincipalClasses=org.apache.activemq.artemis.spi.core.security.jaas.RolePrincipal
        -Dhawtio.http.strictTransportSecurity=max-age=31536000;includeSubDomains;preload
        -Djolokia.policyLocation=file:/var/lib/artemis-instance/etc/jolokia-access.xml
        -Dlog4j2.disableJmx=true
    expose:
      - "61616"
      - "8161"
    volumes:
      - type: bind
        source: ./security/java/blocked-2596bb6dda83c66d96c5a252d7b2ae1f24cc1ae3f1890223b4f3591a8d52bf10.certs
        target: /opt/java/openjdk/lib/security/blocked.certs
        read_only: true
        bind:
          create_host_path: false
      - activemq-data:/var/lib/artemis-instance
    hostname: activemq
    mem_limit: 768m
    networks:
      - my-private-ntwk

  mailpit:
    image: axllent/mailpit:v1.30.0@sha256:0059ef81e492a7192af3816281eed6859eb078bd7bdc58b76757c13e10e53a7d
    restart: unless-stopped
    logging: *default-logging
    environment:
      MP_DISABLE_VERSION_CHECK: "true"
    ports:
      - "127.0.0.1:8025:8025"
    expose:
      - "1025"
    hostname: mailpit
    mem_limit: 64m
    networks:
      - my-private-ntwk

  consumer:
    image: slawekradzyminski/consumer:3.6.0@sha256:6975c932304eaba294b5cba87b14e3d8722ed6e6029031c0455524e0307b8775
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - path: .env.runtime
        required: false
    environment:
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
    expose:
      - "4002"
    hostname: consumer
    depends_on:
      activemq:
        condition: service_started
      mailpit:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # GraalVM native image (~70 MB RSS measured); the heap cap is a runtime argument.
    command: ["-Xmx64m"]
    mem_limit: 160m
    networks:
      - my-private-ntwk

