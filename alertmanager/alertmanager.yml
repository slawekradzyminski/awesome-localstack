global:
  resolve_timeout: 5m

templates:
  - /etc/alertmanager/templates/*.tmpl

# Low-noise policy: this is a training stack and an external uptime monitor covers
# public availability. Warnings stay visible in Prometheus, Grafana and the
# Alertmanager API but are not delivered; only sustained criticals reach Telegram.
route:
  receiver: dashboard-only
  group_by:
    - alertname
    - severity
    - job
    - service
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 24h
  routes:
    - receiver: production-telegram
      matchers:
        - severity="critical"

inhibit_rules:
  # Warning and critical rules of one condition have different alertnames, so pair them by alert_family.
  - source_matchers:
      - severity="critical"
      - alert_family=~".+"
    target_matchers:
      - severity="warning"
    equal:
      - alert_family
      - job
      - service
      - instance
      - name
      - id

receivers:
  - name: dashboard-only
  - name: production-telegram
    telegram_configs:
      - bot_token_file: /etc/alertmanager/secrets/telegram_bot_token
        chat_id_file: /etc/alertmanager/secrets/telegram_chat_id
        send_resolved: false
        parse_mode: ""
        message: '{{ template "telegram.awesome.message" . }}'
