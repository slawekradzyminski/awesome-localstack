name: awesome-full-native

# Monitoring (Prometheus, Grafana, InfluxDB for k6, cAdvisor, Node Exporter) is an
# opt-in overlay: add -f docker-compose.monitoring.yml, or use
# ./run-docker-compose.sh, which includes it by default.

services:
  backend:
    image: slawekradzyminski/backend:3.17.0@sha256:84331dca415fece98042dacec043939492b9bdb4cbcd709c8c179e7130f34264
    restart: always
    expose:
      - "4001"
    hostname: backend
    environment:
      SPRING_PROFILES_ACTIVE: docker,demo
      SPRING_ARTEMIS_BROKER_URL: tcp://activemq:61616
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/testdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      PASSWORD_RESET_FRONTEND_BASE_URL: http://localhost:8081/reset
      SWAGGER_UI_OAUTH2_REDIRECT_URL: http://localhost:8081/swagger-ui/oauth2-redirect.html
      APP_SSO_ENABLED: "true"
      APP_SSO_ISSUER_URI: http://localhost:8082/realms/awesome-testing
      APP_SSO_JWK_SET_URI: http://keycloak:8080/realms/awesome-testing/protocol/openid-connect/certs
      APP_SSO_AUDIENCE: awesome-testing-frontend
      APP_CORS_ALLOWED_ORIGIN_PATTERNS: http://localhost:8081,http://127.0.0.1:8081,http://host.docker.internal:8081
      OLLAMA_BASE_URL: http://ollama-dmr-adapter:11434
      OLLAMA_MAX_TOOL_CALL_ITERATIONS: ${OLLAMA_MAX_TOOL_CALL_ITERATIONS:-8}
      # warehouse-service and payment-service verify access tokens with the backend
      # JWKS (/internal/v1/jwks.json) and call the internal API with their service tokens.
      # RS256 signing key (base64 PKCS#8); empty means an ephemeral key per backend start.
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-}
      WAREHOUSE_SERVICE_TOKEN: ${WAREHOUSE_SERVICE_TOKEN:-local-warehouse-service-token-change-me}
      # payment-service calls the internal API (order data, payment results, the event
      # feed with card refunds) with the payment token; the backend verifies payment
      # result notifications with the webhook secret. The backend never calls it.
      PAYMENT_SERVICE_TOKEN: ${PAYMENT_SERVICE_TOKEN:-local-payment-service-token-change-me}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-local-payment-webhook-secret-change-me}
    models:
      local_llm:
        endpoint_var: DMR_MODEL_ENDPOINT
        model_var: OLLAMA_MODEL
    depends_on:
      activemq:
        condition: service_started
      keycloak:
        condition: service_started
      ollama-dmr-adapter:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - my-private-ntwk

  warehouse-service:
    image: slawekradzyminski/warehouse-service:1.4.0@sha256:3796cd9bdc460d2f7d7f943a0b77f95a0f2ee2d24c5dee6f1ecd2f606feb4033
    restart: always
    expose:
      - "4003"
    hostname: warehouse-service
    environment:
      SPRING_PROFILES_ACTIVE: docker,demo
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/testdb?currentSchema=warehouse
      SPRING_DATASOURCE_USERNAME: warehouse
      SPRING_DATASOURCE_PASSWORD: ${WAREHOUSE_DB_PASSWORD:-local-warehouse-db-password}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,prometheus
      BACKEND_BASE_URL: http://backend:4001
      WAREHOUSE_SERVICE_TOKEN: ${WAREHOUSE_SERVICE_TOKEN:-local-warehouse-service-token-change-me}
    depends_on:
      backend:
        condition: service_healthy
      postgres-roles:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/4003;
          printf 'GET /actuator/health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3;
          read -r _ status _ <&3;
          test "$$status" = 200
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    networks:
      - my-private-ntwk

  payment-service:
    image: slawekradzyminski/payment-service:1.2.0@sha256:b03efeb080df617b8981602d71a2c8f38961fab55be973bfc19c52b29e187c31
    restart: always
    expose:
      - "4004"
    hostname: payment-service
    environment:
      SPRING_PROFILES_ACTIVE: docker,demo
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/testdb?currentSchema=payment
      SPRING_DATASOURCE_USERNAME: payment
      SPRING_DATASOURCE_PASSWORD: ${PAYMENT_DB_PASSWORD:-local-payment-db-password}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,prometheus
      BACKEND_BASE_URL: http://backend:4001
      PAYMENT_SERVICE_TOKEN: ${PAYMENT_SERVICE_TOKEN:-local-payment-service-token-change-me}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-local-payment-webhook-secret-change-me}
    depends_on:
      backend:
        condition: service_healthy
      postgres-roles:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/4004;
          printf 'GET /actuator/health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3;
          read -r _ status _ <&3;
          test "$$status" = 200
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    networks:
      - my-private-ntwk

  ollama-dmr-adapter:
    image: awesome-localstack/ollama-dmr-adapter:local
    build:
      context: ./ollama-dmr-adapter
    restart: unless-stopped
    environment:
      UPSTREAM_HOST: model-runner.docker.internal
      UPSTREAM_PORT: "80"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://model-runner.docker.internal/api/tags', timeout=5).read()
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 5s
    networks:
      - my-private-ntwk

  frontend:
    image: slawekradzyminski/frontend:3.12.0@sha256:96565e441275fe1f35e02f3848d6c28a12277b2551bfd08a20d1da258b7ccd9e
    restart: always
    expose:
      - "80"
    networks:
      - my-private-ntwk

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0@sha256:0f198be292568439d700cdbfb893e69a6009bb43a94a06a945b1d3d506c76b13
    restart: always
    command:
      - start-dev
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8082
    ports:
      - "8082:8080"
    volumes:
      - type: bind
        source: ./security/java/blocked-2596bb6dda83c66d96c5a252d7b2ae1f24cc1ae3f1890223b4f3591a8d52bf10.certs
        target: /usr/lib/jvm/jre-21/lib/security/blocked.certs
        read_only: true
        bind:
          create_host_path: false
      - ./keycloak:/opt/keycloak/data/import:ro
    networks:
      - my-private-ntwk

  keycloak-init:
    image: curlimages/curl:8.21.0@sha256:7c12af72ceb38b7432ab85e1a265cff6ae58e06f95539d539b654f2cfa64bb13
    entrypoint: ["/bin/sh", "/init/init-mock-users.sh"]
    volumes:
      - ./keycloak/init-mock-users.sh:/init/init-mock-users.sh:ro
    environment:
      KEYCLOAK_URL: http://keycloak:8080
    depends_on:
      - keycloak
    restart: "no"
    networks:
      - my-private-ntwk

  docs:
    # Documentation wiki (MkDocs) served at /docs/ through the gateway. Built
    # from docs-site/ with the repository's docs/ as a second build context;
    # the gateway starts without it (variable upstream).
    image: awesome-localstack/docs:local
    # Never pulled: the name is local-only, so a registry image of the same
    # name can never replace the build.
    pull_policy: build
    build:
      context: ./docs-site
      additional_contexts:
        repo-docs: ./docs
    restart: always
    expose:
      - "80"
    mem_limit: 32m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1/docs/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - my-private-ntwk

  gateway:
    image: nginx:1.31.3-trixie@sha256:5a88c9c45479443d7be2eadc894b4ed0a9801bae03d97a5760ae13b5c2005942
    restart: always
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    ports:
      - "8081:80"
    volumes:
      - ./nginx/conf.d/lightweight-app-gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./images:/usr/share/nginx/html/images:ro
      - ./branding:/usr/share/nginx/html/branding:ro
      - ./nginx/conf.d/header-buffers.conf:/etc/nginx/conf.d/header-buffers.conf:ro
    networks:
      - my-private-ntwk

  postgres-roles:
    # One-shot: gives warehouse-service and payment-service their own roles, each
    # limited to its own schema (postgres/service-roles.sh). Runs before every
    # warehouse-service and payment-service start.
    image: postgres:16.14-bookworm@sha256:92620daddcd947f8d5ab5ba66e848702fe443d87fed30c4cea8e389fd78dfc55
    entrypoint: ["bash", "/scripts/service-roles.sh"]
    restart: "no"
    environment:
      PGHOST: postgres
      PGDATABASE: testdb
      PGUSER: postgres
      PGPASSWORD: postgres
      WAREHOUSE_DB_PASSWORD: ${WAREHOUSE_DB_PASSWORD:-local-warehouse-db-password}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:-local-payment-db-password}
    volumes:
      - ./postgres:/scripts:ro
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 64m
    networks:
      - my-private-ntwk

  postgres:
    image: postgres:16.14-bookworm@sha256:92620daddcd947f8d5ab5ba66e848702fe443d87fed30c4cea8e389fd78dfc55
    restart: always
    environment:
      POSTGRES_DB: testdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d testdb"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - my-private-ntwk

  activemq:
    image: apache/artemis:2.55.0@sha256:a192eee9c46e6352625ca9dbf0beebe4a34c363111c628bbb10c4aff1227341d
    restart: always
    environment:
      ARTEMIS_USER: admin
      ARTEMIS_PASSWORD: admin
      ANONYMOUS_LOGIN: "true"
      EXTRA_ARGS: --http-host 0.0.0.0 --relax-jolokia --no-autotune --global-max-size 512M
    ports:
      - "61616:61616"
      - "8161:8161"
      - "5672:5672"
    volumes:
      - type: bind
        source: ./security/java/blocked-2596bb6dda83c66d96c5a252d7b2ae1f24cc1ae3f1890223b4f3591a8d52bf10.certs
        target: /opt/java/openjdk/lib/security/blocked.certs
        read_only: true
        bind:
          create_host_path: false
      - activemq-data:/var/lib/artemis-instance
    hostname: activemq
    networks:
      - my-private-ntwk

  mailpit:
    image: axllent/mailpit:v1.30.0@sha256:0059ef81e492a7192af3816281eed6859eb078bd7bdc58b76757c13e10e53a7d
    restart: always
    environment:
      MP_DISABLE_VERSION_CHECK: "true"
    ports:
      - "8025:8025"
      - "1025:1025"
    hostname: mailpit
    networks:
      - my-private-ntwk

  consumer:
    image: slawekradzyminski/consumer:3.6.0@sha256:6975c932304eaba294b5cba87b14e3d8722ed6e6029031c0455524e0307b8775
    restart: always
    ports:
      - "4002:4002"
    hostname: consumer
    environment:
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
    depends_on:
      activemq:
        condition: service_started
      mailpit:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - my-private-ntwk

volumes:
  activemq-data:
  postgres-data:

models:
  local_llm:
    model: ${OLLAMA_MODEL:-hf.co/prism-ml/Bonsai-27B-gguf:Q1_0}
    context_size: 8192

networks:
  my-private-ntwk:
    driver: bridge
