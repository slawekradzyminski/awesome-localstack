name: awesome-full-native

# Monitoring (Prometheus, Grafana, InfluxDB for k6, cAdvisor, Node Exporter) is an
# opt-in overlay: add -f docker-compose.monitoring.yml, or use
# ./run-docker-compose.sh, which includes it by default.

services:
  backend:
    image: slawekradzyminski/backend:3.20.1@sha256:a47d14898c727aa64374efeb405ac1aea95fe0d047cfbf3b160ea89f46a4de52
    restart: always
    expose:
      - "4001"
    hostname: backend
    environment:
      SPRING_PROFILES_ACTIVE: docker,demo
      SPRING_ARTEMIS_BROKER_URL: tcp://activemq:61616
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/testdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      PASSWORD_RESET_FRONTEND_BASE_URL: http://localhost:8081/reset
      SWAGGER_UI_OAUTH2_REDIRECT_URL: http://localhost:8081/swagger-ui/oauth2-redirect.html
      APP_CORS_ALLOWED_ORIGIN_PATTERNS: http://localhost:8081,http://127.0.0.1:8081,http://host.docker.internal:8081
      OLLAMA_BASE_URL: http://ollama-dmr-adapter:11434
      OLLAMA_MAX_TOOL_CALL_ITERATIONS: ${OLLAMA_MAX_TOOL_CALL_ITERATIONS:-8}
      # warehouse-, payment- and notification-service verify access tokens with the
      # backend JWKS (/internal/v1/jwks.json) and call the internal API with their service tokens.
      # RS256 signing key (base64 PKCS#8); empty means an ephemeral key per backend start.
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-}
      WAREHOUSE_SERVICE_TOKEN: ${WAREHOUSE_SERVICE_TOKEN:-local-warehouse-service-token-change-me}
      # payment-service calls the internal API (order data, payment results, the event
      # feed with card refunds) with the payment token; the backend verifies payment
      # result notifications with the webhook secret. The backend never calls it.
      PAYMENT_SERVICE_TOKEN: ${PAYMENT_SERVICE_TOKEN:-local-payment-service-token-change-me}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-local-payment-webhook-secret-change-me}
      # notification-service (backend 3.21.0+) reads the event feed and the one-time
      # webhook export with its own token, sends the commerce emails and owns user
      # webhooks: the backend records notification.requested feed events instead of
      # sending those emails and runs no webhook dispatcher of its own.
      NOTIFICATION_SERVICE_TOKEN: ${NOTIFICATION_SERVICE_TOKEN:-local-notification-service-token-change-me}
      NOTIFICATIONS_DELIVERY: feed
      WEBHOOKS_ENABLED: "false"
    models:
      local_llm:
        endpoint_var: DMR_MODEL_ENDPOINT
        model_var: OLLAMA_MODEL
    depends_on:
      activemq:
        condition: service_started
      ollama-dmr-adapter:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - my-private-ntwk

  warehouse-service:
    image: slawekradzyminski/warehouse-service:1.4.1@sha256:ffb3f679e922d7e4fcd1f513a9530816a6d8efd9aa40edfa36d215d2c5ea91c5
    restart: always
    expose:
      - "4003"
    hostname: warehouse-service
    environment:
      SPRING_PROFILES_ACTIVE: docker,demo
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/testdb?currentSchema=warehouse
      SPRING_DATASOURCE_USERNAME: warehouse
      SPRING_DATASOURCE_PASSWORD: ${WAREHOUSE_DB_PASSWORD:-local-warehouse-db-password}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,prometheus
      BACKEND_BASE_URL: http://backend:4001
      WAREHOUSE_SERVICE_TOKEN: ${WAREHOUSE_SERVICE_TOKEN:-local-warehouse-service-token-change-me}
    depends_on:
      backend:
        condition: service_healthy
      postgres-roles:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/4003;
          printf 'GET /actuator/health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3;
          read -r _ status _ <&3;
          test "$$status" = 200
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    networks:
      - my-private-ntwk

  payment-service:
    image: slawekradzyminski/payment-service:1.2.1@sha256:1b6a265827b426b5a45aec901361672428a84841f45529a1b2b966d0c0f97e91
    restart: always
    expose:
      - "4004"
    hostname: payment-service
    environment:
      SPRING_PROFILES_ACTIVE: docker,demo
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/testdb?currentSchema=payment
      SPRING_DATASOURCE_USERNAME: payment
      SPRING_DATASOURCE_PASSWORD: ${PAYMENT_DB_PASSWORD:-local-payment-db-password}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,prometheus
      BACKEND_BASE_URL: http://backend:4001
      PAYMENT_SERVICE_TOKEN: ${PAYMENT_SERVICE_TOKEN:-local-payment-service-token-change-me}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-local-payment-webhook-secret-change-me}
    depends_on:
      backend:
        condition: service_healthy
      postgres-roles:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/4004;
          printf 'GET /actuator/health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3;
          read -r _ status _ <&3;
          test "$$status" = 200
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    networks:
      - my-private-ntwk

  notification-service:
    # TODO(release train): notification-service 1.0.0 is not published yet. Pin the
    # published tag@sha256 here, in lightweight-docker-compose.yml and (replacing the
    # PENDING_NOTIFICATION_SERVICE_DIGEST placeholder) in docker-compose.server.yml.
    image: slawekradzyminski/notification-service:1.0.0
    restart: always
    expose:
      - "4005"
    hostname: notification-service
    environment:
      # Shares the backend database (schema notification). Commerce emails go to
      # the `email` queue like the backend's, so consumer delivers them to Mailpit.
      SPRING_PROFILES_ACTIVE: docker,demo
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/testdb?currentSchema=notification
      SPRING_DATASOURCE_USERNAME: notification
      SPRING_DATASOURCE_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-local-notification-db-password}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,prometheus
      BACKEND_BASE_URL: http://backend:4001
      NOTIFICATION_SERVICE_TOKEN: ${NOTIFICATION_SERVICE_TOKEN:-local-notification-service-token-change-me}
      NOTIFICATION_EMAIL_TRANSPORT: jms
      SPRING_ARTEMIS_BROKER_URL: tcp://activemq:61616
    depends_on:
      activemq:
        condition: service_started
      backend:
        condition: service_healthy
      postgres-roles:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/4005;
          printf 'GET /actuator/health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3;
          read -r _ status _ <&3;
          test "$$status" = 200
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    networks:
      - my-private-ntwk

  ollama-dmr-adapter:
    image: awesome-localstack/ollama-dmr-adapter:local
    build:
      context: ./ollama-dmr-adapter
    restart: unless-stopped
    environment:
      UPSTREAM_HOST: model-runner.docker.internal
      UPSTREAM_PORT: "80"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://model-runner.docker.internal/api/tags', timeout=5).read()
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 5s
    networks:
      - my-private-ntwk

  frontend:
    image: slawekradzyminski/frontend:3.14.0@sha256:48ebc560e9fc247fe7b4a43249eba25b61a131f8e98b5da29da883d3baa689ea
    restart: always
    expose:
      - "80"
    networks:
      - my-private-ntwk

  docs:
    # Documentation wiki (MkDocs) served at /docs/ through the gateway. Built
    # from docs-site/ with the repository's docs/ as a second build context;
    # the gateway starts without it (variable upstream).
    image: awesome-localstack/docs:local
    # Never pulled: the name is local-only, so a registry image of the same
    # name can never replace the build.
    pull_policy: build
    build:
      context: ./docs-site
      additional_contexts:
        repo-docs: ./docs
    restart: always
    expose:
      - "80"
    mem_limit: 32m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1/docs/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - my-private-ntwk

  gateway:
    image: nginx:1.31.3-trixie@sha256:5a88c9c45479443d7be2eadc894b4ed0a9801bae03d97a5760ae13b5c2005942
    restart: always
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    ports:
      - "8081:80"
    volumes:
      - ./nginx/conf.d/lightweight-app-gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./images:/usr/share/nginx/html/images:ro
      - ./branding:/usr/share/nginx/html/branding:ro
      - ./nginx/conf.d/header-buffers.conf:/etc/nginx/conf.d/header-buffers.conf:ro
    networks:
      - my-private-ntwk

  postgres-roles:
    # One-shot: gives warehouse-service, payment-service and notification-service
    # their own roles, each limited to its own schema (postgres/service-roles.sh).
    # Runs before every warehouse-, payment- and notification-service start.
    image: postgres:16.14-bookworm@sha256:92620daddcd947f8d5ab5ba66e848702fe443d87fed30c4cea8e389fd78dfc55
    entrypoint: ["bash", "/scripts/service-roles.sh"]
    restart: "no"
    environment:
      PGHOST: postgres
      PGDATABASE: testdb
      PGUSER: postgres
      PGPASSWORD: postgres
      WAREHOUSE_DB_PASSWORD: ${WAREHOUSE_DB_PASSWORD:-local-warehouse-db-password}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:-local-payment-db-password}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-local-notification-db-password}
    volumes:
      - ./postgres:/scripts:ro
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 64m
    networks:
      - my-private-ntwk

  postgres:
    image: postgres:16.14-bookworm@sha256:92620daddcd947f8d5ab5ba66e848702fe443d87fed30c4cea8e389fd78dfc55
    restart: always
    environment:
      POSTGRES_DB: testdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d testdb"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - my-private-ntwk

  activemq:
    image: apache/artemis:2.55.0@sha256:a192eee9c46e6352625ca9dbf0beebe4a34c363111c628bbb10c4aff1227341d
    restart: always
    environment:
      ARTEMIS_USER: admin
      ARTEMIS_PASSWORD: admin
      ANONYMOUS_LOGIN: "true"
      EXTRA_ARGS: --http-host 0.0.0.0 --relax-jolokia --no-autotune --global-max-size 512M
    ports:
      - "61616:61616"
      - "8161:8161"
      - "5672:5672"
    volumes:
      - type: bind
        source: ./security/java/blocked-2596bb6dda83c66d96c5a252d7b2ae1f24cc1ae3f1890223b4f3591a8d52bf10.certs
        target: /opt/java/openjdk/lib/security/blocked.certs
        read_only: true
        bind:
          create_host_path: false
      - activemq-data:/var/lib/artemis-instance
    hostname: activemq
    networks:
      - my-private-ntwk

  mailpit:
    image: axllent/mailpit:v1.30.0@sha256:0059ef81e492a7192af3816281eed6859eb078bd7bdc58b76757c13e10e53a7d
    restart: always
    environment:
      MP_DISABLE_VERSION_CHECK: "true"
    ports:
      - "8025:8025"
      - "1025:1025"
    hostname: mailpit
    networks:
      - my-private-ntwk

  consumer:
    image: slawekradzyminski/consumer:3.6.0@sha256:6975c932304eaba294b5cba87b14e3d8722ed6e6029031c0455524e0307b8775
    restart: always
    ports:
      - "4002:4002"
    hostname: consumer
    environment:
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
    depends_on:
      activemq:
        condition: service_started
      mailpit:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - my-private-ntwk

volumes:
  activemq-data:
  postgres-data:

models:
  local_llm:
    model: ${OLLAMA_MODEL:-hf.co/prism-ml/Bonsai-27B-gguf:Q1_0}
    context_size: 8192

networks:
  my-private-ntwk:
    driver: bridge
