# Paths inside the app_copy_paths directories that the roles render on the
# server and the repository does not track. The asset mirror never deletes
# them (or anything below them).
app_copy_prune_excludes:
  - alertmanager/secrets

# Run after every aitesters sandbox reset: the fresh database repeats earlier event ids,
# which Artemis' duplicate detection would otherwise refuse on this address.
aitesters_events_broker_address: aitesters.commerce.events
aitesters_broker_dedupe_reset_path: /usr/local/sbin/aitesters-broker-dedupe-reset
