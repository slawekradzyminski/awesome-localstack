# Full application convergence for playbooks that do not quiesce the backends
# (reset-demo-state.yml). deploy.yml imports prepare.yml and converge.yml
# separately so that the backend_upgrade quiesce runs between them.
- name: Prepare the release
  ansible.builtin.import_tasks: prepare.yml

- name: Converge the containers
  ansible.builtin.import_tasks: converge.yml
