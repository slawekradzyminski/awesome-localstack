- name: Check for an existing deployed Compose file
  ansible.builtin.stat:
    path: "{{ app_dir }}/{{ app_compose_file }}"
  register: deployed_compose_file

- name: Read the existing deployed Compose file
  ansible.builtin.slurp:
    path: "{{ app_dir }}/{{ app_compose_file }}"
  register: deployed_compose_content
  when: deployed_compose_file.stat.exists

- name: Stop legacy public gateway before introducing the host-network edge
  ansible.builtin.command:
    cmd: docker compose -f {{ app_compose_file }} stop gateway
    chdir: "{{ app_dir }}"
  when:
    - deployed_compose_file.stat.exists
    - deployed_compose_content is defined
    - "'\n  edge:' not in (deployed_compose_content.content | b64decode)"

- name: Ensure application directory exists
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Validate Telegram Alertmanager credentials
  ansible.builtin.assert:
    that:
      - (alertmanager_telegram_bot_token | default('', true) | length) > 0
      - (alertmanager_telegram_chat_id | default('', true) | string | length) > 0
    fail_msg: >-
      alertmanager_telegram_bot_token and alertmanager_telegram_chat_id
      must be configured in Ansible Vault
  no_log: true

- name: Validate PostgreSQL credentials
  ansible.builtin.assert:
    that:
      - (postgres_password | default('', true) | string | length) >= 16
      - (postgres_password | default('', true) | string) != 'postgres'
    fail_msg: >-
      postgres_password must be a non-default value of at least 16 characters
      configured in Ansible Vault
    quiet: true
  no_log: true

- name: Require a published warehouse-service image before deploying
  ansible.builtin.assert:
    that:
      - >-
        warehouse_service_allow_unpinned_image | bool
        or ((lookup('ansible.builtin.file', repo_root ~ '/' ~ app_compose_src) | from_yaml)
            .services['warehouse-service'].image is search('@sha256:[0-9a-f]{64}$')
            and (lookup('ansible.builtin.file', repo_root ~ '/' ~ app_compose_src) | from_yaml)
            .services['aitesters-warehouse-service'].image is search('@sha256:[0-9a-f]{64}$'))
    quiet: true
    fail_msg: >-
      docker-compose.server.yml still builds warehouse-service locally. Publish
      the image from the warehouse-service repository and pin its tag@sha256
      reference before deploying (docs/CONTAINER_RELEASES.md).

- name: Require a published payment-service image before deploying
  ansible.builtin.assert:
    that:
      - >-
        payment_service_allow_unpinned_image | bool
        or ((lookup('ansible.builtin.file', repo_root ~ '/' ~ app_compose_src) | from_yaml)
            .services['payment-service'].image is search('@sha256:[0-9a-f]{64}$')
            and (lookup('ansible.builtin.file', repo_root ~ '/' ~ app_compose_src) | from_yaml)
            .services['aitesters-payment-service'].image is search('@sha256:[0-9a-f]{64}$'))
    quiet: true
    fail_msg: >-
      docker-compose.server.yml does not pin a published payment-service image
      (still the PENDING_PAYMENT_SERVICE_DIGEST placeholder or a bare tag). Publish
      the image from the payment-service repository and pin its tag@sha256
      reference before deploying (docs/CONTAINER_RELEASES.md).

- name: Require a dedicated warehouse service token
  ansible.builtin.assert:
    that:
      - (warehouse_service_token | default('', true) | string | length) >= 32
    quiet: true
    fail_msg: >-
      Configure warehouse_service_token (at least 32 characters) in Ansible Vault.
  no_log: true

- name: Require dedicated aitesters warehouse and database secrets
  ansible.builtin.assert:
    that:
      - (aitesters_warehouse_service_token | default('', true) | string | length) >= 32
      - aitesters_warehouse_service_token != warehouse_service_token
      - (aitesters_postgres_password | default('', true) | string | length) >= 16
      - aitesters_postgres_password != postgres_password
      - (warehouse_postgres_password | default('', true) | string | length) >= 16
      - (aitesters_warehouse_postgres_password | default('', true) | string | length) >= 16
      - warehouse_postgres_password not in [postgres_password, aitesters_postgres_password]
      - aitesters_warehouse_postgres_password not in [postgres_password, aitesters_postgres_password, warehouse_postgres_password]
    quiet: true
    fail_msg: >-
      Configure aitesters_warehouse_service_token (at least 32 characters,
      distinct from the stable token), aitesters_postgres_password (at least 16
      characters, distinct from postgres_password) and distinct
      warehouse_postgres_password and aitesters_warehouse_postgres_password
      values (at least 16 characters each) in Ansible Vault.
  no_log: true

- name: Require dedicated payment-service tokens, webhook secrets and database passwords
  ansible.builtin.assert:
    that:
      - (payment_service_token | default('', true) | string | length) >= 32
      - (aitesters_payment_service_token | default('', true) | string | length) >= 32
      - (payment_webhook_secret | default('', true) | string | length) >= 32
      - (aitesters_payment_webhook_secret | default('', true) | string | length) >= 32
      # Every token and webhook secret is distinct: a leaked value of one site or
      # one caller never authenticates another.
      - >-
        [payment_service_token, aitesters_payment_service_token,
         payment_webhook_secret, aitesters_payment_webhook_secret,
         warehouse_service_token, aitesters_warehouse_service_token]
        | unique | length == 6
      - (payment_postgres_password | default('', true) | string | length) >= 16
      - (aitesters_payment_postgres_password | default('', true) | string | length) >= 16
      - >-
        [postgres_password, aitesters_postgres_password,
         warehouse_postgres_password, aitesters_warehouse_postgres_password,
         payment_postgres_password, aitesters_payment_postgres_password]
        | unique | length == 6
    quiet: true
    fail_msg: >-
      Configure payment_service_token, aitesters_payment_service_token,
      payment_webhook_secret and aitesters_payment_webhook_secret (at least 32
      characters each, distinct from each other and from the warehouse service
      tokens) and payment_postgres_password and aitesters_payment_postgres_password
      (at least 16 characters each, distinct from every other database password)
      in Ansible Vault.
  no_log: true

- name: Read deployed Prometheus configuration checksums
  ansible.builtin.stat:
    path: "{{ app_dir }}/{{ prometheus_config_file }}"
    checksum_algorithm: sha256
  loop: "{{ prometheus_server_config_files }}"
  loop_control:
    loop_var: prometheus_config_file
  register: deployed_prometheus_configs

- name: Read source Prometheus configuration checksums
  ansible.builtin.stat:
    path: "{{ repo_root }}/{{ prometheus_config_file }}"
    checksum_algorithm: sha256
  delegate_to: localhost
  become: false
  loop: "{{ prometheus_server_config_files }}"
  loop_control:
    loop_var: prometheus_config_file
  register: source_prometheus_configs

- name: Read deployed Alertmanager configuration checksums
  ansible.builtin.stat:
    path: "{{ app_dir }}/{{ alertmanager_config_file }}"
    checksum_algorithm: sha256
  loop: "{{ alertmanager_config_files }}"
  loop_control:
    loop_var: alertmanager_config_file
  register: deployed_alertmanager_configs

- name: Read source Alertmanager configuration checksums
  ansible.builtin.stat:
    path: "{{ repo_root }}/{{ alertmanager_config_file }}"
    checksum_algorithm: sha256
  delegate_to: localhost
  become: false
  loop: "{{ alertmanager_config_files }}"
  loop_control:
    loop_var: alertmanager_config_file
  register: source_alertmanager_configs

- name: Copy Docker Compose file
  ansible.builtin.copy:
    src: "{{ repo_root }}/{{ app_compose_src }}"
    dest: "{{ app_dir }}/{{ app_compose_file }}"
    owner: root
    group: root
    mode: "0644"

- name: Copy deployment asset directories
  ansible.builtin.copy:
    src: "{{ repo_root }}/{{ item }}"
    dest: "{{ app_dir }}/"
    owner: root
    group: root
    mode: preserve
  loop: "{{ app_copy_paths }}"
  register: app_copy_results

- name: Detect whether nginx assets changed
  ansible.builtin.set_fact:
    gateway_config_changed: >-
      {{
        app_copy_results.results
        | selectattr('item', 'equalto', 'nginx')
        | selectattr('changed')
        | list
        | length > 0
      }}

- name: Detect whether Prometheus assets changed
  ansible.builtin.set_fact:
    prometheus_config_changed: >-
      {{
        (
          deployed_prometheus_configs.results
          | selectattr('stat.exists', 'equalto', false)
          | list
          | length
        ) > 0
        or
        (
          deployed_prometheus_configs.results
          | selectattr('stat.exists')
          | map(attribute='stat.checksum')
          | list
        )
        !=
        (
          source_prometheus_configs.results
          | map(attribute='stat.checksum')
          | list
        )
      }}

- name: Detect whether Alertmanager assets changed
  ansible.builtin.set_fact:
    alertmanager_config_changed: >-
      {{
        (
          deployed_alertmanager_configs.results
          | selectattr('stat.exists', 'equalto', false)
          | list
          | length
        ) > 0
        or
        (
          deployed_alertmanager_configs.results
          | selectattr('stat.exists')
          | map(attribute='stat.checksum')
          | list
        )
        !=
        (
          source_alertmanager_configs.results
          | map(attribute='stat.checksum')
          | list
        )
      }}

- name: Require distinct RS256 signing keys for both backends
  ansible.builtin.assert:
    that:
      # base64 PKCS#8 DER of an RSA key of at least 2048 bits is over 1500 characters
      - (jwt_signing_key | default('', true) | length) >= 1500
      - (aitesters_jwt_signing_key | default('', true) | length) >= 1500
      - aitesters_jwt_signing_key != jwt_signing_key
      - jwt_signing_key is match('^[A-Za-z0-9+/=]+$')
      - aitesters_jwt_signing_key is match('^[A-Za-z0-9+/=]+$')
      # PKCS#8 (version 0, rsaEncryption), not the PKCS#1 that `genpkey -outform DER` writes
      - jwt_signing_key is match('^MIIE..IBADANBgkqhkiG9w0BAQEF')
      - aitesters_jwt_signing_key is match('^MIIE..IBADANBgkqhkiG9w0BAQEF')
    quiet: true
    fail_msg: >-
      Configure jwt_signing_key and a distinct aitesters_jwt_signing_key in
      Ansible Vault: single-line base64 PKCS#8 RSA private keys of at least
      2048 bits (openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048
      | openssl pkcs8 -topk8 -nocrypt -outform DER | base64 | tr -d '\n').
  no_log: true

- name: Render the isolated sandbox runtime environment
  ansible.builtin.template:
    src: env.aitesters.j2
    dest: "{{ app_dir }}/.env.aitesters"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Render runtime environment file
  ansible.builtin.template:
    src: env.runtime.j2
    dest: "{{ app_dir }}/.env.runtime"
    owner: root
    group: root
    mode: "0600"

- name: Render the warehouse-service runtime environment
  ansible.builtin.template:
    src: env.warehouse.j2
    dest: "{{ app_dir }}/.env.warehouse"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Render the payment-service runtime environment
  ansible.builtin.template:
    src: env.payment.j2
    dest: "{{ app_dir }}/.env.payment"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Render the aitesters service and database runtime environments
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ app_dir }}/{{ item.dest }}"
    owner: root
    group: root
    mode: "0600"
  loop:
    - src: env.aitesters-warehouse.j2
      dest: .env.aitesters-warehouse
    - src: env.aitesters-payment.j2
      dest: .env.aitesters-payment
    - src: env.aitesters-postgres.j2
      dest: .env.aitesters-postgres
    - src: env.postgres-roles.j2
      dest: .env.postgres-roles
    - src: env.aitesters-postgres-roles.j2
      dest: .env.aitesters-postgres-roles
  loop_control:
    label: "{{ item.dest }}"
  no_log: true

- name: Normalize application directory ownership
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: root
    group: root
    recurse: true

- name: Ensure gateway static assets are readable by nginx
  ansible.builtin.file:
    path: "{{ app_dir }}/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "u=rwX,go=rX"
    recurse: true
  loop:
    - images
    - branding

- name: Ensure mounted service config assets are readable by containers
  ansible.builtin.file:
    path: "{{ app_dir }}/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "u=rwX,go=rX"
    recurse: true
  loop:
    - prometheus

- name: Remove the retired production Grafana assets
  # Grafana left the server profile (lean monitoring phase A); the dashboards
  # stay in the repository for the local monitoring overlay.
  ansible.builtin.file:
    path: "{{ app_dir }}/grafana"
    state: absent

- name: Ensure Alertmanager configuration assets are readable
  ansible.builtin.file:
    path: "{{ app_dir }}/alertmanager"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure Alertmanager configuration file is readable
  ansible.builtin.file:
    path: "{{ app_dir }}/alertmanager/alertmanager.yml"
    state: file
    owner: root
    group: root
    mode: "0644"

- name: Ensure Alertmanager templates are readable
  ansible.builtin.file:
    path: "{{ app_dir }}/alertmanager/templates"
    state: directory
    owner: root
    group: root
    mode: "u=rwX,go=rX"
    recurse: true

- name: Ensure Alertmanager secrets directory exists
  ansible.builtin.file:
    path: "{{ app_dir }}/alertmanager/secrets"
    state: directory
    owner: root
    group: root
    mode: "0711"

- name: Render Telegram bot token for Alertmanager
  ansible.builtin.copy:
    content: "{{ alertmanager_telegram_bot_token }}\n"
    dest: "{{ app_dir }}/alertmanager/secrets/telegram_bot_token"
    owner: "65534"
    group: "65534"
    mode: "0400"
  register: alertmanager_telegram_token_file
  no_log: true

- name: Render Telegram chat ID for Alertmanager
  ansible.builtin.copy:
    content: "{{ alertmanager_telegram_chat_id }}\n"
    dest: "{{ app_dir }}/alertmanager/secrets/telegram_chat_id"
    owner: "65534"
    group: "65534"
    mode: "0400"
  register: alertmanager_telegram_chat_id_file
  no_log: true

- name: Check whether PostgreSQL is already running
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ app_compose_file }}"
      - ps
      - -q
      - postgres
    chdir: "{{ app_dir }}"
  register: app_postgres_container
  changed_when: false
  failed_when: false

- name: Check whether PostgreSQL accepts the Vault-managed password
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ app_compose_file }}"
      - exec
      - -T
      - -e
      - PGPASSWORD
      - postgres
      - psql
      - --host=postgres
      - --username=postgres
      - --dbname=postgres
      - --tuples-only
      - --no-align
      - --command=SELECT 1
    chdir: "{{ app_dir }}"
  environment:
    PGPASSWORD: "{{ postgres_password }}"
  register: postgres_vault_password_check
  changed_when: false
  failed_when: false
  no_log: true
  when: app_postgres_container.stdout | trim | length > 0

- name: Reconcile the existing PostgreSQL role password with Ansible Vault
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ app_compose_file }}"
      - exec
      - -T
      - postgres
      - psql
      - --username=postgres
      - --dbname=postgres
      - --set=ON_ERROR_STOP=1
    chdir: "{{ app_dir }}"
    stdin: >-
      ALTER ROLE postgres WITH PASSWORD
      '{{ postgres_password | replace("'", "''") }}';
  register: postgres_password_reconciliation
  changed_when: true
  no_log: true
  when:
    - app_postgres_container.stdout | trim | length > 0
    - postgres_vault_password_check.rc != 0

- name: Verify the reconciled PostgreSQL password
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ app_compose_file }}"
      - exec
      - -T
      - -e
      - PGPASSWORD
      - postgres
      - psql
      - --host=postgres
      - --username=postgres
      - --dbname=postgres
      - --tuples-only
      - --no-align
      - --command=SELECT 1
    chdir: "{{ app_dir }}"
  environment:
    PGPASSWORD: "{{ postgres_password }}"
  changed_when: false
  no_log: true
  when: postgres_password_reconciliation is changed

# The docs wiki is the only image built on the server: static MkDocs output on
# a digest-pinned nginx base, built from the copied docs/ and docs-site/
# directories. BuildKit's cache keeps unchanged builds to a few seconds; the
# deploy below recreates the container when the image ID changed.
- name: Build the documentation wiki image
  ansible.builtin.shell:
    cmd: >-
      set -eu;
      before="$(docker image inspect --format '{{ '{{.Id}}' }}' awesome-localstack/docs:local 2>/dev/null || true)";
      docker compose -f {{ app_compose_file }} build docs >&2;
      after="$(docker image inspect --format '{{ '{{.Id}}' }}' awesome-localstack/docs:local)";
      if [ "$before" != "$after" ]; then echo rebuilt; fi
    chdir: "{{ app_dir }}"
  register: docs_image_build
  changed_when: "'rebuilt' in docs_image_build.stdout"

- name: Deploy Docker Compose stack
  community.docker.docker_compose_v2:
    project_src: "{{ app_dir }}"
    files:
      - "{{ app_compose_file }}"
    pull: missing
    recreate: auto
    remove_orphans: true
    state: present
    wait: true
    wait_timeout: 300

- name: Restart Prometheus when its configuration assets change
  ansible.builtin.command:
    cmd: docker compose -f {{ app_compose_file }} restart prometheus
    chdir: "{{ app_dir }}"
  when: prometheus_config_changed

- name: Restart Alertmanager when its configuration or secrets change
  ansible.builtin.command:
    cmd: docker compose -f {{ app_compose_file }} restart alertmanager
    chdir: "{{ app_dir }}"
  when:
    - >-
      alertmanager_config_changed
      or alertmanager_telegram_token_file is changed
      or alertmanager_telegram_chat_id_file is changed

- name: Ensure Artemis service account exists in the broker instance
  ansible.builtin.shell: |
    docker compose -f {{ app_compose_file }} exec -T activemq sh -lc '
      set -eu
      users_file="etc/artemis-users.properties"
      roles_file="etc/artemis-roles.properties"
      changed=0

      if grep -q "^{{ artemis_username }} =" "$users_file"; then
        if ! grep -q "^{{ artemis_username }} = {{ artemis_password }}$" "$users_file"; then
          sed -i "s|^{{ artemis_username }} =.*|{{ artemis_username }} = {{ artemis_password }}|" "$users_file"
          changed=1
        fi
      else
        printf "\n{{ artemis_username }} = {{ artemis_password }}\n" >> "$users_file"
        changed=1
      fi

      if grep -q "^amq =" "$roles_file"; then
        if ! grep -q "^amq = .*{{ artemis_username }}" "$roles_file"; then
          sed -i "s/^amq = .*/&,{{ artemis_username }}/" "$roles_file"
          changed=1
        fi
      else
        printf "\namq = {{ artemis_username }}\n" >> "$roles_file"
        changed=1
      fi

      if grep -q "^admin =" "$users_file"; then
        sed -i "/^admin =/d" "$users_file"
        changed=1
      fi

      if grep -q "^amq =" "$roles_file"; then
        current_roles=$(sed -n "s/^amq = //p" "$roles_file")
        normalized_roles=$(printf "%s" "$current_roles" | sed "s/admin,//g; s/,admin//g; s/^admin$//")
        if [ "$normalized_roles" != "$current_roles" ]; then
          if [ -n "$normalized_roles" ]; then
            sed -i "s/^amq = .*/amq = $normalized_roles/" "$roles_file"
          else
            sed -i "/^amq =/d" "$roles_file"
          fi
          changed=1
        fi
      fi

      if [ "$changed" -eq 1 ]; then
        echo changed
      fi
    '
  args:
    chdir: "{{ app_dir }}"
    executable: /bin/sh
  register: artemis_service_user_result
  changed_when: "'changed' in artemis_service_user_result.stdout"
  when:
    - (artemis_username | default('', true)) | length > 0
    - (artemis_password | default('', true)) | length > 0

- name: Restart Artemis and consumer when broker credentials change
  ansible.builtin.command:
    cmd: docker compose -f {{ app_compose_file }} restart activemq consumer
    chdir: "{{ app_dir }}"
  when: artemis_service_user_result is changed

- name: Recreate gateway to refresh Docker upstream addresses
  community.docker.docker_compose_v2:
    project_src: "{{ app_dir }}"
    files:
      - "{{ app_compose_file }}"
    services:
      - gateway
      - edge
    recreate: always
    state: present
    wait: true
    wait_timeout: 60

- name: Install aitesters reset service
  ansible.builtin.template:
    src: aitesters-reset.service.j2
    dest: /etc/systemd/system/aitesters-reset.service
    owner: root
    group: root
    mode: "0644"
  register: aitesters_reset_service_unit
  when: aitesters_reset_enabled | bool

- name: Install aitesters reset timer
  ansible.builtin.template:
    src: aitesters-reset.timer.j2
    dest: /etc/systemd/system/aitesters-reset.timer
    owner: root
    group: root
    mode: "0644"
  register: aitesters_reset_timer_unit
  when: aitesters_reset_enabled | bool

- name: Reload systemd when aitesters reset unit changes
  ansible.builtin.systemd_service:
    daemon_reload: true
  when:
    - aitesters_reset_enabled | bool
    - aitesters_reset_service_unit is changed or aitesters_reset_timer_unit is changed

- name: Enable aitesters daily reset timer
  ansible.builtin.systemd_service:
    name: aitesters-reset.timer
    enabled: true
    state: started
  when: aitesters_reset_enabled | bool
