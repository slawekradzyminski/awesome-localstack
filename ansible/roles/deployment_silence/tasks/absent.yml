- name: Expire the deployment silences after successful verification
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ app_compose_file }}"
      - exec
      - -T
      - gateway
      - curl
      - --fail
      - --silent
      - --show-error
      - --request
      - DELETE
      - "http://alertmanager:9093/api/v2/silence/{{ item }}"
    chdir: "{{ app_dir }}"
  loop: "{{ deployment_silence_ids }}"
  changed_when: true
  when: deployment_silence_ids is defined

- name: Report expired deployment silences
  ansible.builtin.debug:
    msg: >-
      Expired the planned deployment warning silences after successful
      verification; normal warning notifications are active again.
  when: deployment_silence_ids is defined

- name: Resume the host watchdog container checks after successful verification
  ansible.builtin.command:
    argv:
      - "{{ watchdog_script_path | default('/usr/local/sbin/awesome-watchdog') }}"
      - maintenance
      - stop
    removes: "{{ watchdog_script_path | default('/usr/local/sbin/awesome-watchdog') }}"
  changed_when: true
