# Opt-in maintenance window for database/ciphertext changes incompatible with old binaries.
- name: Require encrypted backups for a coordinated backend upgrade
  ansible.builtin.assert:
    that:
      - postgres_backup_enabled | bool
      - postgres_backup_pre_deploy | bool
    fail_msg: Coordinated backend upgrades require encrypted pre-deployment backups.

- name: Read the selected backend release from the source Compose file
  ansible.builtin.set_fact:
    backend_upgrade_image: "{{ (lookup('file', repo_root ~ '/' ~ app_compose_src) | from_yaml).services.backend.image }}"

- name: Pull the selected backend release before interrupting requests
  ansible.builtin.command:
    argv:
      - docker
      - pull
      - "{{ backend_upgrade_image }}"
  changed_when: false

# The deployed Compose file is the previous release, so a service introduced by
# this release (for example warehouse-service on its first rollout) is not
# defined there yet and must not be named in the stop command.
- name: Read the services defined by the currently deployed Compose file
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ app_compose_file }}"
      - config
      - --services
    chdir: "{{ app_dir }}"
  register: backend_upgrade_deployed_services
  changed_when: false

- name: Stop both old backend instances and their warehouse- and payment-services before applying incompatible migrations
  ansible.builtin.command:
    argv: >-
      {{ ['docker', 'compose', '-f', app_compose_file, 'stop', '--timeout', '60']
         + (backend_upgrade_stop_services
            | intersect(backend_upgrade_deployed_services.stdout_lines)) }}
    chdir: "{{ app_dir }}"
  vars:
    backend_upgrade_stop_services:
      - backend
      - aitesters-backend
      - warehouse-service
      - aitesters-warehouse-service
      - payment-service
      - aitesters-payment-service

- name: Create encrypted PostgreSQL backup after backend writes have stopped
  ansible.builtin.command:
    cmd: /usr/local/sbin/awesome-postgres-backup backend-upgrade-quiesced
  register: backend_upgrade_quiesced_backup
  changed_when: true
