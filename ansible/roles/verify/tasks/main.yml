- name: Show Docker Compose service status
  ansible.builtin.command:
    cmd: docker compose -f {{ app_compose_file }} ps
    chdir: "{{ app_dir }}"
  register: compose_ps
  changed_when: false

- name: Print Docker Compose service status
  ansible.builtin.debug:
    var: compose_ps.stdout_lines

- name: Read the resolved production Compose configuration
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ app_compose_file }}"
      - config
      - --format
      - json
    chdir: "{{ app_dir }}"
  register: verify_compose_config_response
  changed_when: false
  no_log: true

- name: Record expected production services and image references
  ansible.builtin.set_fact:
    verify_compose_config: "{{ verify_compose_config_response.stdout | from_json }}"
    verify_expected_services: >-
      {{
        (verify_compose_config_response.stdout | from_json).services.keys()
        | list
        | sort
      }}
  no_log: true

- name: Read running production services
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ app_compose_file }}"
      - ps
      - --services
      - --status
      - running
    chdir: "{{ app_dir }}"
  register: verify_running_services_response
  changed_when: false

- name: Verify every production service is running
  ansible.builtin.assert:
    quiet: true
    that:
      - >-
        verify_expected_services
        | difference(verify_running_services_response.stdout_lines)
        | length == 0
      - >-
        verify_running_services_response.stdout_lines
        | difference(verify_expected_services)
        | length == 0
    fail_msg: >-
      Expected running services {{ verify_expected_services }}, got
      {{ verify_running_services_response.stdout_lines }}

- name: Verify PostgreSQL authentication with the Vault-managed password
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ app_compose_file }}"
      - exec
      - -T
      - -e
      - PGPASSWORD
      - postgres
      - psql
      - --host=postgres
      - --username=postgres
      - --dbname=postgres
      - --tuples-only
      - --no-align
      - --command=SELECT 1
    chdir: "{{ app_dir }}"
  environment:
    PGPASSWORD: "{{ postgres_password }}"
  register: verify_postgres_vault_password
  changed_when: false
  no_log: true

- name: Resolve running production container IDs
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ app_compose_file }}"
      - ps
      - -q
      - "{{ item }}"
    chdir: "{{ app_dir }}"
  loop: "{{ verify_expected_services }}"
  register: verify_running_container_id_results
  changed_when: false

- name: Resolve running container image IDs
  ansible.builtin.command:
    argv:
      - docker
      - inspect
      - "--format={{ '{{.Image}}' }}"
      - "{{ item.stdout }}"
  loop: "{{ verify_running_container_id_results.results }}"
  loop_control:
    label: "{{ item.item }}"
  register: verify_running_image_id_results
  changed_when: false

- name: Resolve reviewed image-reference IDs
  ansible.builtin.command:
    argv:
      - docker
      - image
      - inspect
      - "--format={{ '{{.Id}}' }}"
      - "{{ verify_compose_config.services[item].image }}"
  loop: "{{ verify_expected_services }}"
  register: verify_expected_image_id_results
  changed_when: false

- name: Verify running containers use the reviewed image references
  ansible.builtin.assert:
    quiet: true
    that:
      - verify_running_image_id_results.results[verify_image_index].stdout == item.stdout
    fail_msg: >-
      Service {{ item.item }} is running image ID
      {{ verify_running_image_id_results.results[verify_image_index].stdout }},
      but {{ verify_compose_config.services[item.item].image }} resolves to
      {{ item.stdout }}
  loop: "{{ verify_expected_image_id_results.results }}"
  loop_control:
    index_var: verify_image_index
    label: "{{ item.item }}"

- name: Create a unique JMS delivery-contract identifier
  ansible.builtin.command:
    argv:
      - date
      - +%s%N
  register: verify_jms_contract_id
  changed_when: false

- name: Record the JMS delivery-contract payload
  ansible.builtin.set_fact:
    verify_jms_contract_subject: >-
      Awesome deployment JMS contract {{ verify_jms_contract_id.stdout }}
    verify_jms_contract_message:
      to: delivery-contract@example.test
      subject: >-
        Awesome deployment JMS contract {{ verify_jms_contract_id.stdout }}
      message: Artemis to consumer to Mailpit production verification
      template: GENERIC
      properties: {}

- name: Publish the JMS delivery-contract message
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ app_compose_file }}"
      - exec
      - -T
      - activemq
      - /var/lib/artemis-instance/bin/artemis
      - producer
      - --url
      - tcp://localhost:61616
      - --user
      - "{{ artemis_username }}"
      - --password
      - "{{ artemis_password }}"
      - --destination
      - queue://email
      - --message-count
      - "1"
      - --message
      - "{{ verify_jms_contract_message | to_json }}"
      - --properties
      - '[{"type":"string","key":"_awesome_","value":"EmailDTO"}]'
      - --silent
    chdir: "{{ app_dir }}"
  register: verify_jms_publish
  changed_when: true
  no_log: true
  until: verify_jms_publish.rc == 0
  retries: "{{ verify_retries }}"
  delay: "{{ verify_delay_seconds }}"

- name: Wait for the consumer to deliver the contract email to Mailpit
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ app_compose_file }}"
      - exec
      - -T
      - gateway
      - curl
      - -fsS
      - http://mailpit:8025/api/v1/messages
    chdir: "{{ app_dir }}"
  register: verify_jms_mailpit_response
  changed_when: false
  until:
    - verify_jms_mailpit_response.rc == 0
    - >-
      verify_jms_contract_subject in
      (
        (verify_jms_mailpit_response.stdout | from_json).messages
        | map(attribute='Subject')
        | list
      )
  retries: "{{ verify_retries }}"
  delay: "{{ verify_delay_seconds }}"

- name: Record the delivered JMS contract email
  ansible.builtin.set_fact:
    verify_jms_delivered_message: >-
      {{
        (verify_jms_mailpit_response.stdout | from_json).messages
        | selectattr('Subject', 'equalto', verify_jms_contract_subject)
        | first
      }}

- name: Verify the JMS contract email recipient
  ansible.builtin.assert:
    quiet: true
    that:
      - >-
        'delivery-contract@example.test' in
        (verify_jms_delivered_message.To | map(attribute='Address') | list)
    fail_msg: >-
      JMS contract email reached Mailpit with unexpected recipients:
      {{ verify_jms_delivered_message.To }}

- name: Verify internal monitoring endpoints
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ app_compose_file }}"
      - exec
      - -T
      - gateway
      - curl
      - -fsS
      - -o
      - /dev/null
      - "{{ item }}"
    chdir: "{{ app_dir }}"
  loop:
    - http://node-exporter:9100/metrics
    - http://cadvisor:8080/metrics
    - http://prometheus:9090/-/ready
    - http://alertmanager:9093/-/ready
    - http://blackbox-exporter:9115/-/healthy
  register: verify_monitoring_endpoint
  changed_when: false
  until: verify_monitoring_endpoint.rc == 0
  retries: "{{ verify_retries }}"
  delay: "{{ verify_delay_seconds }}"

- name: Read active Prometheus targets
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ app_compose_file }}"
      - exec
      - -T
      - gateway
      - curl
      - -fsS
      - http://prometheus:9090/api/v1/targets
    chdir: "{{ app_dir }}"
  register: prometheus_targets_response
  changed_when: false
  vars:
    expected_prometheus_jobs:
      - spring_backend_micrometer
      - spring_consumer_micrometer
      - node
      - cadvisor
      - alertmanager
      - blackbox
      - public_https
  until:
    - prometheus_targets_response.rc == 0
    - >-
      (
        expected_prometheus_jobs
        | difference(
            (prometheus_targets_response.stdout | from_json).data.activeTargets
            | selectattr('health', 'equalto', 'up')
            | map(attribute='labels.job')
            | list
          )
        | length
      ) == 0
  retries: "{{ verify_retries }}"
  delay: "{{ verify_delay_seconds }}"

- name: Record healthy Prometheus target jobs
  ansible.builtin.set_fact:
    prometheus_healthy_target_jobs: >-
      {{
        (prometheus_targets_response.stdout | from_json).data.activeTargets
        | selectattr('health', 'equalto', 'up')
        | map(attribute='labels.job')
        | list
      }}

- name: Verify all expected Prometheus jobs are healthy
  ansible.builtin.assert:
    that:
      - item in prometheus_healthy_target_jobs
    fail_msg: "Prometheus job {{ item }} is not healthy"
  loop:
    - spring_backend_micrometer
    - spring_consumer_micrometer
    - node
    - cadvisor
    - alertmanager
    - blackbox
    - public_https

- name: Verify Prometheus discovered Alertmanager
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ app_compose_file }}"
      - exec
      - -T
      - gateway
      - curl
      - -fsS
      - http://prometheus:9090/api/v1/alertmanagers
    chdir: "{{ app_dir }}"
  register: prometheus_alertmanagers_response
  changed_when: false
  until:
    - prometheus_alertmanagers_response.rc == 0
    - >-
      (
        (prometheus_alertmanagers_response.stdout | from_json)
        .data.activeAlertmanagers
        | length
      ) > 0
  retries: "{{ verify_retries }}"
  delay: "{{ verify_delay_seconds }}"

- name: Read loaded Prometheus alert rules
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ app_compose_file }}"
      - exec
      - -T
      - gateway
      - curl
      - -fsS
      - http://prometheus:9090/api/v1/rules?type=alert
    chdir: "{{ app_dir }}"
  register: prometheus_rules_response
  changed_when: false
  until:
    - prometheus_rules_response.rc == 0
    - ((prometheus_rules_response.stdout | from_json).data.groups | length) > 0
  retries: "{{ verify_retries }}"
  delay: "{{ verify_delay_seconds }}"

- name: Record loaded Prometheus alert rule names
  ansible.builtin.set_fact:
    prometheus_loaded_rule_names: >-
      {{
        (prometheus_rules_response.stdout | from_json).data.groups
        | map(attribute='rules')
        | flatten
        | map(attribute='name')
        | list
      }}

- name: Verify required production alert rules are loaded
  ansible.builtin.assert:
    quiet: true
    that:
      - item in prometheus_loaded_rule_names
    fail_msg: "Prometheus alert rule {{ item }} is not loaded"
  loop:
    - HostAvailableMemoryLow
    - HostAvailableMemoryCritical
    - HostKernelOOMKill
    - HostSwapUsageHigh
    - HostSwapThrashing
    - HostRootDiskSpaceLow
    - ContainerMemoryNearLimit
    - ContainerOOMEvent
    - CriticalContainerMissing
    - JVMHeapUsageHigh
    - PrometheusTargetDown
    - AlertmanagerNotificationFailures
    - PublicEndpointProbeFailed
    - PublicEndpointTLSExpiringSoon

- name: Verify Blackbox Exporter binary version
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ app_compose_file }}"
      - exec
      - -T
      - blackbox-exporter
      - /bin/blackbox_exporter
      - --version
    chdir: "{{ app_dir }}"
  register: blackbox_exporter_version
  changed_when: false
  failed_when: >-
    blackbox_exporter_version.rc != 0
    or 'version 0.28.0' not in blackbox_exporter_version.stdout

- name: Query public HTTPS probe results
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ app_compose_file }}"
      - exec
      - -T
      - gateway
      - curl
      - -fsS
      - -G
      - --data-urlencode
      - query=probe_success{job="public_https"}
      - http://prometheus:9090/api/v1/query
    chdir: "{{ app_dir }}"
  register: public_probe_response
  changed_when: false
  until:
    - public_probe_response.rc == 0
    - ((public_probe_response.stdout | from_json).data.result | length) == 2
    - >-
      (
        (public_probe_response.stdout | from_json).data.result
        | map(attribute='value')
        | map('last')
        | map('float')
        | min
      ) == 1
  retries: "{{ verify_retries }}"
  delay: "{{ verify_delay_seconds }}"

- name: Verify managed emergency swap
  ansible.builtin.command:
    argv:
      - swapon
      - --show
      - --noheadings
      - --raw
      - --output
      - NAME
  register: verify_swap
  changed_when: false
  failed_when: >-
    verify_swap.rc != 0
    or swap_file_path not in verify_swap.stdout_lines
  when: swap_enabled | bool

- name: Verify managed swappiness
  ansible.builtin.command:
    argv:
      - sysctl
      - -n
      - vm.swappiness
  register: verify_swappiness
  changed_when: false
  failed_when: >-
    verify_swappiness.rc != 0
    or verify_swappiness.stdout | int != swap_swappiness | int
  when: swap_enabled | bool

- name: Verify Alertmanager binary version
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ app_compose_file }}"
      - exec
      - -T
      - alertmanager
      - /bin/alertmanager
      - --version
    chdir: "{{ app_dir }}"
  register: alertmanager_version
  changed_when: false
  failed_when: >-
    alertmanager_version.rc != 0
    or 'version 0.32.1' not in alertmanager_version.stdout

- name: Verify Alertmanager secret file permissions
  ansible.builtin.command:
    argv:
      - stat
      - -c
      - "%a:%u:%g"
      - "{{ item }}"
  loop:
    - "{{ app_dir }}/alertmanager/secrets/telegram_bot_token"
    - "{{ app_dir }}/alertmanager/secrets/telegram_chat_id"
  register: alertmanager_secret_permissions
  changed_when: false
  failed_when: >-
    alertmanager_secret_permissions.rc != 0
    or alertmanager_secret_permissions.stdout != "400:65534:65534"

- name: Query effective Spring JVM maximum heaps
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ app_compose_file }}"
      - exec
      - -T
      - gateway
      - curl
      - -fsS
      - -G
      - --data-urlencode
      - "query=sum(jvm_memory_max_bytes{area=\"heap\",job=\"{{ item.job }}\"})"
      - http://prometheus:9090/api/v1/query
    chdir: "{{ app_dir }}"
  loop:
    - job: spring_backend_micrometer
      maximum_bytes: 939524096
    - job: spring_consumer_micrometer
      maximum_bytes: 805306368
  loop_control:
    label: "{{ item.job }}"
  register: jvm_maximum_heap_responses
  changed_when: false
  until:
    - jvm_maximum_heap_responses.rc == 0
    - ((jvm_maximum_heap_responses.stdout | from_json).data.result | length) == 1
  retries: "{{ verify_retries }}"
  delay: "{{ verify_delay_seconds }}"

- name: Verify Spring JVM maximum heaps are bounded
  ansible.builtin.assert:
    quiet: true
    that:
      - ((item.stdout | from_json).data.result[0].value[1] | float) <= (item.item.maximum_bytes | float)
    fail_msg: >-
      Effective maximum heap for {{ item.item.job }} exceeds
      {{ item.item.maximum_bytes }} bytes
  loop: "{{ jvm_maximum_heap_responses.results }}"
  loop_control:
    label: "{{ item.item.job }}"

- name: Verify the production resource dashboard is provisioned
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ app_compose_file }}"
      - exec
      - -T
      - grafana
      - test
      - -r
      - /etc/grafana/provisioning/dashboards/production_resources.json
    chdir: "{{ app_dir }}"
  changed_when: false

- name: Verify the production safeguards dashboard is provisioned
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ app_compose_file }}"
      - exec
      - -T
      - grafana
      - test
      - -r
      - /etc/grafana/provisioning/dashboards/production_safeguards.json
    chdir: "{{ app_dir }}"
  changed_when: false

- name: Verify local HTTP endpoints
  ansible.builtin.uri:
    url: "{{ item.url }}"
    status_code: "{{ item.status_code }}"
    return_content: false
  loop: "{{ verify_urls }}"
  register: verify_http_result
  until: verify_http_result.status == item.status_code
  retries: "{{ verify_retries }}"
  delay: "{{ verify_delay_seconds }}"

- name: Sign in with bootstrap admin for authenticated verification
  ansible.builtin.uri:
    url: http://127.0.0.1/api/v1/users/signin
    method: POST
    body_format: json
    body:
      username: "{{ app_bootstrap_admin_username }}"
      password: "{{ app_bootstrap_admin_password }}"
    status_code: 200
    return_content: true
  register: verify_admin_signin
  until: verify_admin_signin.status == 200
  retries: "{{ verify_retries }}"
  delay: "{{ verify_delay_seconds }}"

- name: Verify bootstrap product catalog is present
  ansible.builtin.uri:
    url: http://127.0.0.1/api/v1/products
    method: GET
    headers:
      Authorization: "Bearer {{ (verify_admin_signin.content | from_json).token }}"
    status_code: 200
    return_content: true
  register: verify_products_response
  failed_when: >
    verify_products_response.status != 200 or
    ((verify_products_response.content | from_json) | length) == 0

- name: Verify aitesters login route through gateway host routing
  ansible.builtin.uri:
    url: http://127.0.0.1/login
    headers:
      Host: "{{ aitesters_hostname }}"
    status_code: 200
    return_content: false
  register: verify_aitesters_login
  until: verify_aitesters_login.status == 200
  retries: "{{ verify_retries }}"
  delay: "{{ verify_delay_seconds }}"

- name: Verify aitesters OpenAPI route through gateway host routing
  ansible.builtin.uri:
    url: http://127.0.0.1/v3/api-docs
    headers:
      Host: "{{ aitesters_hostname }}"
    status_code: 200
    return_content: true
  register: verify_aitesters_openapi
  until: verify_aitesters_openapi.status == 200
  retries: "{{ verify_retries }}"
  delay: "{{ verify_delay_seconds }}"

- name: Sign in to aitesters with seeded local admin
  ansible.builtin.uri:
    url: http://127.0.0.1/api/v1/users/signin
    method: POST
    headers:
      Host: "{{ aitesters_hostname }}"
    body_format: json
    body:
      username: "{{ aitesters_admin_username }}"
      password: "{{ aitesters_admin_password }}"
    status_code: 200
    return_content: true
  register: verify_aitesters_admin_signin
  until: verify_aitesters_admin_signin.status == 200
  retries: "{{ verify_retries }}"
  delay: "{{ verify_delay_seconds }}"

- name: Verify aitesters product catalog is present
  ansible.builtin.uri:
    url: http://127.0.0.1/api/v1/products
    method: GET
    headers:
      Host: "{{ aitesters_hostname }}"
      Authorization: "Bearer {{ (verify_aitesters_admin_signin.content | from_json).token }}"
    status_code: 200
    return_content: true
  register: verify_aitesters_products_response
  failed_when: >
    verify_aitesters_products_response.status != 200 or
    ((verify_aitesters_products_response.content | from_json) | length) == 0

- name: Verify aitesters traffic diagnostics with an isolated client session
  ansible.builtin.uri:
    url: http://127.0.0.1/api/v1/traffic/logs
    method: GET
    headers:
      Host: "{{ aitesters_hostname }}"
      Authorization: "Bearer {{ (verify_aitesters_admin_signin.content | from_json).token }}"
      X-Client-Session-Id: 00000000-0000-4000-8000-000000000001
    status_code: 200
    return_content: false
  no_log: true

- name: Verify aitesters outbox rejects a missing secondary access key
  ansible.builtin.uri:
    url: http://127.0.0.1/api/v1/local/email/outbox
    method: GET
    headers:
      Host: "{{ aitesters_hostname }}"
      Authorization: "Bearer {{ (verify_aitesters_admin_signin.content | from_json).token }}"
    status_code: 403
    return_content: false
  no_log: true

- name: Verify aitesters outbox accepts the configured secondary access key
  ansible.builtin.uri:
    url: http://127.0.0.1/api/v1/local/email/outbox
    method: GET
    headers:
      Host: "{{ aitesters_hostname }}"
      Authorization: "Bearer {{ (verify_aitesters_admin_signin.content | from_json).token }}"
      X-Local-Outbox-Key: "{{ local_email_outbox_access_key }}"
    status_code: 200
    return_content: false
  no_log: true
