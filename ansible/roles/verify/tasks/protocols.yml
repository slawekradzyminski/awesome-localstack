- name: Verify authenticated GraphQL commerce through both gateway host routes
  ansible.builtin.uri:
    url: http://127.0.0.1/api/v1/graphql
    method: POST
    headers:
      Host: "{{ item.hostname }}"
      Authorization: "Bearer {{ item.token }}"
    body_format: json
    body:
      query: '{ products(limit: 1) { items { id name } } cart { totalItems } orders { total } inventory(size: 1) { total } }'
    status_code: 200
    return_content: true
  loop:
    - hostname: awesome.byst.re
      token: "{{ (verify_admin_signin.content | from_json).token }}"
    - hostname: "{{ aitesters_hostname }}"
      token: "{{ (verify_aitesters_admin_signin.content | from_json).token }}"
  register: verify_graphql_response
  failed_when: >-
    verify_graphql_response.status != 200 or
    (verify_graphql_response.json.errors | default([]) | length) > 0 or
    (verify_graphql_response.json.data.products['items'] | default([]) | length) == 0
  no_log: true

- name: Verify direct backend GraphQL routes with the same authenticated query
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ app_compose_file }}"
      - exec
      - -T
      - "{{ item.service }}"
      - curl
      - --fail-with-body
      - --silent
      - --show-error
      - -H
      - "Authorization: Bearer {{ item.token }}"
      - -H
      - 'Content-Type: application/json'
      - --data
      - '{"query":"{ products(limit: 1) { items { id } } inventory(size: 1) { total } }"}'
      - http://127.0.0.1:4001/api/v1/graphql
    chdir: "{{ app_dir }}"
  loop:
    - service: backend
      token: "{{ (verify_admin_signin.content | from_json).token }}"
    - service: aitesters-backend
      token: "{{ (verify_aitesters_admin_signin.content | from_json).token }}"
  register: verify_direct_graphql
  changed_when: false
  failed_when: >-
    verify_direct_graphql.rc != 0 or
    ((verify_direct_graphql.stdout | from_json).errors | default([]) | length) > 0
  no_log: true

- name: Verify anonymous GraphQL execution remains protected
  ansible.builtin.uri:
    url: http://127.0.0.1/api/v1/graphql
    method: POST
    headers:
      Host: "{{ item }}"
    body_format: json
    body:
      query: '{ products(limit: 1) { total } }'
    status_code: 401
  loop:
    - awesome.byst.re
    - "{{ aitesters_hostname }}"

- name: Verify GraphiQL shell through both host routes
  ansible.builtin.uri:
    url: http://127.0.0.1/api/v1/graphiql?path=/api/v1/graphql
    headers:
      Host: "{{ item }}"
    status_code: 200
  loop:
    - awesome.byst.re
    - "{{ aitesters_hostname }}"

- name: Verify optional native gRPC listeners are reachable on host loopback
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ item }}"
    timeout: 20
  loop:
    - 9091
    - 9092

- name: Verify tokens cannot cross the stable and sandbox authentication boundaries
  ansible.builtin.uri:
    url: http://127.0.0.1/api/v1/users/me
    headers:
      Host: "{{ item.hostname }}"
      Authorization: "Bearer {{ item.other_site_token }}"
    status_code: 401
  loop:
    - hostname: awesome.byst.re
      other_site_token: "{{ (verify_aitesters_admin_signin.content | from_json).token }}"
    - hostname: "{{ aitesters_hostname }}"
      other_site_token: "{{ (verify_admin_signin.content | from_json).token }}"
  no_log: true
