ansible_host: "{{ production_ssh_host }}"
ansible_port: "{{ production_ssh_port }}"
ansible_user: "{{ production_ssh_user }}"
ansible_ssh_private_key_file: "{{ production_ssh_key_path }}"

app_dir: /opt/awesome-localstack
app_compose_file: docker-compose.server.yml
repo_root: "{{ playbook_dir | dirname | dirname }}"
reset_demo_postgres_volume_name: awesome-server_postgres-data
aitesters_hostname: aitesters.byst.re
aitesters_legacy_hostname: aitesters.awesome.byst.re
aitesters_admin_username: admin
aitesters_admin_password: LocalDemoAdmin123!
aitesters_reset_enabled: true
aitesters_reset_schedule: "*-*-* 03:00:00"
aitesters_reset_log_file: /var/log/aitesters-reset.log

base_packages:
  - ca-certificates
  - curl
  - gnupg
  - openssl
  - rsync

ssh_hardening_enabled: true
ssh_service_name: ssh

docker_apt_arch_map:
  x86_64: amd64
  aarch64: arm64

docker_apt_arch: "{{ docker_apt_arch_map.get(ansible_facts['architecture'], ansible_facts['architecture']) }}"
docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

docker_log_max_size: 10m
docker_log_max_file: "5"

journald_system_max_use: 100M
journald_max_retention_sec: 14day

# MIKR.US runs this VPS inside LXC and rejects swapon with EPERM. Keep the
# convergent role ready for a future VM/package that grants swap capability,
# but do not leave an unusable /etc/fstab entry on this host.
swap_enabled: false
swap_disabled_reason: The MIKR.US LXC virtualization layer does not permit swapon.
swap_file_path: /swapfile
swap_file_size_mb: 1024
swap_swappiness: 10

app_compose_src: docker-compose.server.yml

postgres_backup_enabled: true
postgres_backup_root: /var/backups/awesome-localstack/postgres
postgres_backup_environment_file: /etc/awesome-localstack/postgres-backup.env
postgres_backup_daily_retention: 7
postgres_backup_weekly_retention: 4
postgres_backup_schedule: "*-*-* 02:15:00"
postgres_restore_check_schedule: "Sun *-*-* 04:15:00"
postgres_backup_pre_deploy: true
postgres_backup_remote_target: "{{ backup_remote_target | default('', true) }}"
postgres_backup_encryption_passphrase: "{{ backup_encryption_passphrase | default('', true) }}"
postgres_backup_database: testdb
postgres_backup_user: postgres
postgres_restore_image: postgres:16.14-bookworm@sha256:92620daddcd947f8d5ab5ba66e848702fe443d87fed30c4cea8e389fd78dfc55

app_copy_paths:
  - security
  - postgres
  - nginx
  - grafana
  - prometheus
  - alertmanager
  - blackbox
  - images
  - branding

prometheus_server_config_files:
  - prometheus/prometheus.server.yml
  - prometheus/rules/host.yml
  - prometheus/rules/containers.yml
  - prometheus/rules/jvm.yml
  - prometheus/rules/services.yml

alertmanager_config_files:
  - alertmanager/alertmanager.yml
  - alertmanager/templates/telegram.tmpl

app_runtime_env:
  POSTGRES_PASSWORD: "{{ postgres_password | default('', true) }}"
  SPRING_DATASOURCE_PASSWORD: "{{ postgres_password | default('', true) }}"
  GF_SECURITY_ADMIN_PASSWORD: "{{ grafana_admin_password | default('', true) }}"
  ARTEMIS_USER: "{{ artemis_username | default('', true) }}"
  ARTEMIS_PASSWORD: "{{ artemis_password | default('', true) }}"
  SPRING_ARTEMIS_USER: "{{ artemis_username | default('', true) }}"
  SPRING_ARTEMIS_PASSWORD: "{{ artemis_password | default('', true) }}"
  SPRING_ACTIVEMQ_USER: "{{ artemis_username | default('', true) }}"
  SPRING_ACTIVEMQ_PASSWORD: "{{ artemis_password | default('', true) }}"
  APP_BOOTSTRAP_ADMIN_ENABLED: "{{ app_bootstrap_admin_enabled | default('', true) }}"
  APP_BOOTSTRAP_ADMIN_USERNAME: "{{ app_bootstrap_admin_username | default('', true) }}"
  APP_BOOTSTRAP_ADMIN_PASSWORD: "{{ app_bootstrap_admin_password | default('', true) }}"
  APP_BOOTSTRAP_ADMIN_EMAIL: "{{ app_bootstrap_admin_email | default('', true) }}"
  APP_BOOTSTRAP_ADMIN_FIRST_NAME: "{{ app_bootstrap_admin_first_name | default('', true) }}"
  APP_BOOTSTRAP_ADMIN_LAST_NAME: "{{ app_bootstrap_admin_last_name | default('', true) }}"
  APP_MFA_ENCRYPTION_PASSWORD: "{{ app_mfa_encryption_password | default('', true) }}"
  APP_MFA_ENCRYPTION_SALT: "{{ app_mfa_encryption_salt | default('', true) }}"
  JWT_SIGNING_KEY: "{{ jwt_signing_key | default('', true) }}"
  WAREHOUSE_SERVICE_TOKEN: "{{ warehouse_service_token | default('', true) }}"
  PAYMENT_SERVICE_TOKEN: "{{ payment_service_token | default('', true) }}"
  PAYMENT_WEBHOOK_SECRET: "{{ payment_webhook_secret | default('', true) }}"
  LOCAL_EMAIL_OUTBOX_ACCESS_KEY: "{{ local_email_outbox_access_key | default('', true) }}"
  APP_BOOTSTRAP_PRODUCTS_ENABLED: "true"

# warehouse-service receives only what it needs: the service token and the
# password of its own `warehouse` database role, which owns only the `warehouse`
# schema of the backend database. It verifies access tokens with the backend's
# public JWKS, so it holds no signing key.
warehouse_runtime_env:
  WAREHOUSE_SERVICE_TOKEN: "{{ warehouse_service_token | default('', true) }}"
  SPRING_DATASOURCE_PASSWORD: "{{ warehouse_postgres_password | default('', true) }}"

# The aitesters sandbox has its own warehouse-service and aitesters-postgres; it
# verifies tokens with aitesters-backend's JWKS, so stable-site tokens never
# authenticate there.
aitesters_warehouse_runtime_env:
  WAREHOUSE_SERVICE_TOKEN: "{{ aitesters_warehouse_service_token | default('', true) }}"
  SPRING_DATASOURCE_PASSWORD: "{{ aitesters_warehouse_postgres_password | default('', true) }}"

# payment-service receives only the payment service token (shared with the
# backend, which uses it for refund calls), the webhook secret that signs its
# result notifications to the backend, and the password of its own `payment`
# database role, which owns only the `payment` schema of the backend database.
# Like warehouse-service it verifies access tokens with the backend's JWKS.
payment_runtime_env:
  PAYMENT_SERVICE_TOKEN: "{{ payment_service_token | default('', true) }}"
  PAYMENT_WEBHOOK_SECRET: "{{ payment_webhook_secret | default('', true) }}"
  SPRING_DATASOURCE_PASSWORD: "{{ payment_postgres_password | default('', true) }}"

# The aitesters sandbox has its own payment-service with its own token, webhook
# secret and `payment` role on aitesters-postgres.
aitesters_payment_runtime_env:
  PAYMENT_SERVICE_TOKEN: "{{ aitesters_payment_service_token | default('', true) }}"
  PAYMENT_WEBHOOK_SECRET: "{{ aitesters_payment_webhook_secret | default('', true) }}"
  SPRING_DATASOURCE_PASSWORD: "{{ aitesters_payment_postgres_password | default('', true) }}"

# One-shot postgres-roles services (postgres/service-roles.sh): the superuser
# password and the warehouse and payment role passwords for each database.
postgres_roles_env:
  PGPASSWORD: "{{ postgres_password | default('', true) }}"
  WAREHOUSE_DB_PASSWORD: "{{ warehouse_postgres_password | default('', true) }}"
  PAYMENT_DB_PASSWORD: "{{ payment_postgres_password | default('', true) }}"

aitesters_postgres_roles_env:
  PGPASSWORD: "{{ aitesters_postgres_password | default('', true) }}"
  WAREHOUSE_DB_PASSWORD: "{{ aitesters_warehouse_postgres_password | default('', true) }}"
  PAYMENT_DB_PASSWORD: "{{ aitesters_payment_postgres_password | default('', true) }}"

# Compose services that run once and exit; verification expects them exited 0
# instead of running.
verify_oneshot_services:
  - postgres-roles
  - aitesters-postgres-roles

# The server cannot build the GraalVM native image (memory, missing sibling
# checkout). Deployments stop until docker-compose.server.yml pins a published
# warehouse-service digest; override only for a deliberate pre-built local image.
warehouse_service_allow_unpinned_image: false
# The same gate for payment-service (and aitesters-payment-service).
payment_service_allow_unpinned_image: false

verify_urls:
  - url: http://127.0.0.1/login
    status_code: 200
  - url: http://127.0.0.1/v3/api-docs
    status_code: 200
  - url: http://127.0.0.1/images/iphone.png
    status_code: 200
  - url: http://127.0.0.1/warehouse/v3/api-docs
    status_code: 200
  - url: http://127.0.0.1/payment/v3/api-docs
    status_code: 200
  # Public tracking reaches warehouse-service, which answers 404 for an unknown
  # tracking number (the backend would answer 401 without a token).
  - url: http://127.0.0.1/api/v1/tracking/VERIFY-UNKNOWN-TRACKING
    status_code: 404
  - url: http://127.0.0.1/internal/v1/orders/1
    status_code: 404
  - url: http://127.0.0.1/mailpit/api/v1/messages
    status_code: 404
  - url: http://127.0.0.1/mailpit/
    status_code: 404
  - url: http://127.0.0.1/mailhog/api/v2/messages
    status_code: 404
  - url: http://127.0.0.1/mailhog/
    status_code: 404
verify_retries: 12
verify_delay_seconds: 10

cleanup_enabled: true
cleanup_retention_days: 30
cleanup_schedule: "*-*-* 04:45:00"
cleanup_unused_images: true
cleanup_legacy_artemis_volume: 52872b8d5d81bd2a5b8016993442b445559710bb5e8f3bcb92022f0fc5505add
cleanup_legacy_artemis_backup: /var/backups/awesome-localstack/artemis/artemis-instance-pre-2.55-20260801T105500Z.tgz.enc
