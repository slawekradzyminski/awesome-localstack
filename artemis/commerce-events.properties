# Commerce event topology of the broker transport (docs/EVENT_BROKER_CONTRACT.md).
# Loaded by `artemis run --properties <this file>` in every stack with a broker, on top of the
# instance's broker.xml, so it also applies to the production instance that already exists.
#
# Per site one MULTICAST address with one durable queue per consuming service, filtered on the
# `type` property the backend's relay sets. The queues must exist before the first event is
# published: a multicast address without queues drops the message.
#
# A delivery that fails is redelivered after 1 s, 2 s, 4 s and 8 s; after the fifth attempt the
# message moves to the dead-letter address, where every consumer queue has its own dead-letter
# queue (filtered on the queue it failed on). Nothing expires.

# --- dead-letter address -------------------------------------------------------------
addressConfigurations."commerce.events.DLA".routingTypes=MULTICAST
addressConfigurations."commerce.events.DLA".queueConfigs."DLQ.awesome.commerce.events.warehouse-service".address=commerce.events.DLA
addressConfigurations."commerce.events.DLA".queueConfigs."DLQ.awesome.commerce.events.warehouse-service".routingType=MULTICAST
addressConfigurations."commerce.events.DLA".queueConfigs."DLQ.awesome.commerce.events.warehouse-service".filterString=_AMQ_ORIG_QUEUE = 'awesome.commerce.events.warehouse-service'
addressConfigurations."commerce.events.DLA".queueConfigs."DLQ.awesome.commerce.events.payment-service".address=commerce.events.DLA
addressConfigurations."commerce.events.DLA".queueConfigs."DLQ.awesome.commerce.events.payment-service".routingType=MULTICAST
addressConfigurations."commerce.events.DLA".queueConfigs."DLQ.awesome.commerce.events.payment-service".filterString=_AMQ_ORIG_QUEUE = 'awesome.commerce.events.payment-service'
addressConfigurations."commerce.events.DLA".queueConfigs."DLQ.awesome.commerce.events.notification-service".address=commerce.events.DLA
addressConfigurations."commerce.events.DLA".queueConfigs."DLQ.awesome.commerce.events.notification-service".routingType=MULTICAST
addressConfigurations."commerce.events.DLA".queueConfigs."DLQ.awesome.commerce.events.notification-service".filterString=_AMQ_ORIG_QUEUE = 'awesome.commerce.events.notification-service'
addressConfigurations."commerce.events.DLA".queueConfigs."DLQ.aitesters.commerce.events.warehouse-service".address=commerce.events.DLA
addressConfigurations."commerce.events.DLA".queueConfigs."DLQ.aitesters.commerce.events.warehouse-service".routingType=MULTICAST
addressConfigurations."commerce.events.DLA".queueConfigs."DLQ.aitesters.commerce.events.warehouse-service".filterString=_AMQ_ORIG_QUEUE = 'aitesters.commerce.events.warehouse-service'
addressConfigurations."commerce.events.DLA".queueConfigs."DLQ.aitesters.commerce.events.payment-service".address=commerce.events.DLA
addressConfigurations."commerce.events.DLA".queueConfigs."DLQ.aitesters.commerce.events.payment-service".routingType=MULTICAST
addressConfigurations."commerce.events.DLA".queueConfigs."DLQ.aitesters.commerce.events.payment-service".filterString=_AMQ_ORIG_QUEUE = 'aitesters.commerce.events.payment-service'
addressConfigurations."commerce.events.DLA".queueConfigs."DLQ.aitesters.commerce.events.notification-service".address=commerce.events.DLA
addressConfigurations."commerce.events.DLA".queueConfigs."DLQ.aitesters.commerce.events.notification-service".routingType=MULTICAST
addressConfigurations."commerce.events.DLA".queueConfigs."DLQ.aitesters.commerce.events.notification-service".filterString=_AMQ_ORIG_QUEUE = 'aitesters.commerce.events.notification-service'

# --- awesome site ---------------------------------------------------------------------
addressConfigurations."awesome.commerce.events".routingTypes=MULTICAST
addressConfigurations."awesome.commerce.events".queueConfigs."awesome.commerce.events.warehouse-service".address=awesome.commerce.events
addressConfigurations."awesome.commerce.events".queueConfigs."awesome.commerce.events.warehouse-service".routingType=MULTICAST
addressConfigurations."awesome.commerce.events".queueConfigs."awesome.commerce.events.warehouse-service".filterString=type IN ('order.cancelled','stock.restore-requested')
addressConfigurations."awesome.commerce.events".queueConfigs."awesome.commerce.events.payment-service".address=awesome.commerce.events
addressConfigurations."awesome.commerce.events".queueConfigs."awesome.commerce.events.payment-service".routingType=MULTICAST
addressConfigurations."awesome.commerce.events".queueConfigs."awesome.commerce.events.payment-service".filterString=type = 'card-refund.requested'
addressConfigurations."awesome.commerce.events".queueConfigs."awesome.commerce.events.notification-service".address=awesome.commerce.events
addressConfigurations."awesome.commerce.events".queueConfigs."awesome.commerce.events.notification-service".routingType=MULTICAST
addressConfigurations."awesome.commerce.events".queueConfigs."awesome.commerce.events.notification-service".filterString=type NOT IN ('card-refund.requested','stock.restore-requested')

# --- aitesters site ---------------------------------------------------------------------
addressConfigurations."aitesters.commerce.events".routingTypes=MULTICAST
addressConfigurations."aitesters.commerce.events".queueConfigs."aitesters.commerce.events.warehouse-service".address=aitesters.commerce.events
addressConfigurations."aitesters.commerce.events".queueConfigs."aitesters.commerce.events.warehouse-service".routingType=MULTICAST
addressConfigurations."aitesters.commerce.events".queueConfigs."aitesters.commerce.events.warehouse-service".filterString=type IN ('order.cancelled','stock.restore-requested')
addressConfigurations."aitesters.commerce.events".queueConfigs."aitesters.commerce.events.payment-service".address=aitesters.commerce.events
addressConfigurations."aitesters.commerce.events".queueConfigs."aitesters.commerce.events.payment-service".routingType=MULTICAST
addressConfigurations."aitesters.commerce.events".queueConfigs."aitesters.commerce.events.payment-service".filterString=type = 'card-refund.requested'
addressConfigurations."aitesters.commerce.events".queueConfigs."aitesters.commerce.events.notification-service".address=aitesters.commerce.events
addressConfigurations."aitesters.commerce.events".queueConfigs."aitesters.commerce.events.notification-service".routingType=MULTICAST
addressConfigurations."aitesters.commerce.events".queueConfigs."aitesters.commerce.events.notification-service".filterString=type NOT IN ('card-refund.requested','stock.restore-requested')

# --- delivery settings of both sites' addresses --------------------------------------
addressSettings."*.commerce.events".maxDeliveryAttempts=5
addressSettings."*.commerce.events".redeliveryDelay=1000
addressSettings."*.commerce.events".redeliveryMultiplier=2
addressSettings."*.commerce.events".maxRedeliveryDelay=30000
addressSettings."*.commerce.events".deadLetterAddress=commerce.events.DLA
addressSettings."*.commerce.events".autoCreateDeadLetterResources=false
