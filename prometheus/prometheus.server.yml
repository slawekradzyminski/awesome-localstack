global:
  scrape_interval: 10s
  evaluation_interval: 15s
  external_labels:
    environment: production
    stack: awesome-server

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: spring_backend_micrometer
    metrics_path: /actuator/prometheus
    scrape_interval: 5s
    static_configs:
      - targets:
          - backend:4001

  - job_name: spring_consumer_micrometer
    metrics_path: /actuator/prometheus
    scrape_interval: 5s
    static_configs:
      - targets:
          - consumer:4002

  - job_name: node
    scrape_interval: 15s
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: cadvisor
    scrape_interval: 30s
    static_configs:
      - targets:
          - cadvisor:8080

  - job_name: alertmanager
    scrape_interval: 15s
    static_configs:
      - targets:
          - alertmanager:9093

  - job_name: blackbox
    scrape_interval: 15s
    static_configs:
      - targets:
          - blackbox-exporter:9115

  - job_name: public_https
    metrics_path: /probe
    scrape_interval: 30s
    scrape_timeout: 10s
    params:
      module:
        - public_https
    static_configs:
      - targets:
          - https://awesome.byst.re/login
          - https://awesome.byst.re/v3/api-docs
        labels:
          service: public-edge
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
