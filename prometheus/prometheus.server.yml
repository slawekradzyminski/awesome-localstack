global:
  scrape_interval: 10s
  evaluation_interval: 15s
  external_labels:
    environment: production
    stack: awesome-server

scrape_configs:
  - job_name: spring_backend_micrometer
    metrics_path: /actuator/prometheus
    scrape_interval: 5s
    static_configs:
      - targets:
          - backend:4001

  - job_name: spring_consumer_micrometer
    metrics_path: /actuator/prometheus
    scrape_interval: 5s
    static_configs:
      - targets:
          - consumer:4002

  - job_name: node
    scrape_interval: 15s
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: cadvisor
    scrape_interval: 30s
    static_configs:
      - targets:
          - cadvisor:8080
