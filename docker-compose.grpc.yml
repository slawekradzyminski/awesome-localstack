# Opt-in native inventory gRPC listener for the same pinned backend release.
# Add this override after the chosen base Compose file; existing profiles survive.
services:
  backend:
    image: ${GRPC_BACKEND_IMAGE:-slawekradzyminski/backend:3.9.1@sha256:b1931ada6be3b1d5a5ef75837a146ae32f4fa8739b51011b8ec81ce9b70c6ed3}
    environment:
      SPRING_PROFILES_INCLUDE: graphql,grpc
      GRPC_HOST: 0.0.0.0
      GRPC_PORT: "9091"
      GRPC_REFLECTION_ENABLED: ${GRPC_REFLECTION_ENABLED:-false}
    ports:
      - "127.0.0.1:${GRPC_HOST_PORT:-9091}:9091"
