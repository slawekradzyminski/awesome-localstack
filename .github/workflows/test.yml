name: CI

on: [push]

permissions:
  contents: read

jobs:
  verifyPostgresRestore:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Verify restore waits for permanent PostgreSQL startup
      run: python3 scripts/verify-postgres-restore.py

  verifyDeploymentSilence:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Verify coordinated backend upgrade ordering
      run: python3 scripts/verify-backend-upgrade.py
    - name: Verify bounded deployment alert silence
      run: python3 scripts/verify-deployment-silence.py

  verifyEdgeProxy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Verify trusted edge proxy sanitization
      run: bash ./scripts/verify-edge-proxy.sh

  runDocker:
    runs-on: ubuntu-latest
    services:
      docker:
        image: docker:29.6.2-cli@sha256:be132a9f282288de4afaf63379dff75711fda0147c6b72a9df44e51841402144
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Build and run Docker Compose
      run: USE_OLLAMA_MOCK=true bash ./run-docker-compose.sh

  verifyOllamaConfig:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Verify Docker Model Runner and mock overrides
      run: bash ./scripts/verify-ollama-config.sh
    - name: Test Docker Model Runner adapter
      run: python3 -m unittest ollama-dmr-adapter/test_adapter.py

  verifyReleaseImages:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Verify Java certificate mitigation in every profile
      run: python3 scripts/verify-java-security.py
    - name: Verify immutable first-party image set
      run: python3 scripts/verify-release-images.py
    - name: Verify all remotely pulled images are immutable
      run: python3 scripts/verify-image-pins.py

  verifyLightweight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Run published lightweight compatibility set
      shell: bash
      run: |
        set -Eeuo pipefail
        cleanup() {
          result=$?
          if [[ $result -ne 0 ]]; then
            docker compose -f lightweight-docker-compose.yml ps --all
            docker compose -f lightweight-docker-compose.yml logs --no-color --tail=200
          fi
          docker compose -f lightweight-docker-compose.yml down --volumes --remove-orphans
          exit "$result"
        }
        trap cleanup EXIT

        docker compose -f lightweight-docker-compose.yml config --quiet
        # Pull every published image fresh, but never look up the locally built
        # docs image in a registry (its name is local-only).
        docker compose -f lightweight-docker-compose.yml pull --ignore-buildable
        docker compose -f lightweight-docker-compose.yml up -d --wait --wait-timeout 300
        curl --fail --silent --show-error http://127.0.0.1:8081/login >/dev/null
        curl --fail --silent --show-error http://127.0.0.1:8081/docs/ | grep -F 'Awesome LocalStack Wiki' >/dev/null
        curl --fail --silent --show-error http://127.0.0.1:8081/v3/api-docs >/dev/null
        # warehouse-service and payment-service through the gateway (up --wait already
        # required their healthchecks and the postgres-roles one-shot to pass).
        curl --fail --silent --show-error http://127.0.0.1:8081/warehouse/v3/api-docs >/dev/null
        curl --fail --silent --show-error http://127.0.0.1:8081/payment/v3/api-docs >/dev/null
        curl --fail --silent --show-error --request POST http://127.0.0.1:11434/api/generate \
          --header 'Content-Type: application/json' \
          --data '{"model":"qwen3.5:2b","prompt":"Provide a motivational quote","stream":false}' \
          | grep -F '"done":true' >/dev/null

  verifyDocsSite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Build the documentation site in strict mode (broken links and anchors fail)
      run: |
        python3 -m venv /tmp/docs-venv
        /tmp/docs-venv/bin/pip install --quiet -r docs-site/requirements.txt
        NO_MKDOCS_2_WARNING=1 /tmp/docs-venv/bin/mkdocs build --strict -f docs-site/mkdocs.yml -d /tmp/docs-site
    - name: Build and smoke-test the docs image
      shell: bash
      run: |
        set -Eeuo pipefail
        docker build --build-context repo-docs=docs -t awesome-localstack/docs:local docs-site
        docker run -d --name docs-smoke --memory 32m -p 127.0.0.1:8090:80 awesome-localstack/docs:local
        trap 'docker logs docs-smoke || true; docker rm -f docs-smoke >/dev/null' EXIT
        for _ in $(seq 1 30); do
          curl --fail --silent --output /dev/null http://127.0.0.1:8090/docs/ && break
          sleep 1
        done
        curl --fail --silent --show-error http://127.0.0.1:8090/docs/ | grep -F 'Awesome LocalStack Wiki' >/dev/null
        curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8090/docs/flows/payments/
        curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8090/docs/reference/ANSIBLE/
        curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8090/docs/assets/javascripts/mermaid.min.js
        test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8090/docs/no-such-page/)" = 404
        test "$(curl --silent --output /dev/null --write-out '%{http_code} %header{location}' http://127.0.0.1:8090/docs)" = "301 /docs/"

  runDocker-Jenkins:
    runs-on: ubuntu-latest
    services:
      docker:
        image: docker:29.6.2-cli@sha256:be132a9f282288de4afaf63379dff75711fda0147c6b72a9df44e51841402144
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Build and run Docker Compose CI version
      run: bash ./run-docker-compose-jenkins.sh
