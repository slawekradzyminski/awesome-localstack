name: CI

# Pull requests and main. A branch without a pull request runs on request
# (workflow_dispatch). A newer push to a pull request cancels its running CI.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Decides which expensive jobs the change needs. The contract scripts and the
  # docs image always run; the Compose profiles are skipped when only
  # documentation changed, the Jenkins image when none of its inputs changed.
  # Anything this job cannot compare (manual run, first push) runs everything.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      stack: ${{ steps.filter.outputs.stack }}
      jenkins: ${{ steps.filter.outputs.jenkins }}
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0
    - name: Classify the changed files
      id: filter
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
        BEFORE: ${{ github.event.before }}
      run: |
        set -Eeuo pipefail
        files=""
        if [[ "$EVENT" == pull_request ]]; then
          # The checked-out merge commit: first parent is the base branch.
          files="$(git diff --name-only HEAD^1 HEAD)"
        elif [[ "$EVENT" == push && -n "$BEFORE" ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
          files="$(git diff --name-only "$BEFORE" "$GITHUB_SHA")"
        fi
        stack=true
        jenkins=true
        if [[ -n "$files" ]]; then
          grep -qvE '^(docs/|docs-site/|[^/]+\.md$)' <<<"$files" || stack=false
          grep -qE '^(Dockerfile$|entrypoint\.sh$|docker-compose-jenkins\.yml$|run-docker-compose-jenkins\.sh$|security/java/|\.github/workflows/test\.yml$)' <<<"$files" || jenkins=false
        fi
        printf '%s\n' "$files" | sed 's/^/  /'
        echo "stack=$stack jenkins=$jenkins"
        echo "stack=$stack" >> "$GITHUB_OUTPUT"
        echo "jenkins=$jenkins" >> "$GITHUB_OUTPUT"

  # Every contract script in one job. Each step runs even when an earlier one
  # failed, so one run reports every broken contract.
  verifyContracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ANSIBLE_CORE_VERSION: 2.20.5
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Verify restore waits for permanent PostgreSQL startup
      run: python3 scripts/verify-postgres-restore.py
    - name: Verify coordinated backend upgrade ordering
      if: ${{ !cancelled() }}
      run: python3 scripts/verify-backend-upgrade.py
    - name: Verify bounded deployment alert silence
      if: ${{ !cancelled() }}
      run: python3 scripts/verify-deployment-silence.py
    - name: Verify lean production monitoring and local overlay contract
      if: ${{ !cancelled() }}
      run: python3 scripts/verify-production-monitoring.py
    - name: Test the host watchdog with a fake Docker CLI and Telegram endpoint
      if: ${{ !cancelled() }}
      run: python3 scripts/verify-watchdog.py -v
    - name: Verify trusted edge proxy sanitization
      if: ${{ !cancelled() }}
      run: bash ./scripts/verify-edge-proxy.sh
    # Static contract (every server block and proxied location, ECS logging),
    # then the pinned nginx with stub upstreams: ids generated, preserved when
    # valid, replaced when invalid, passed upstream and echoed back once.
    - name: Verify gateway correlation IDs
      if: ${{ !cancelled() }}
      run: python3 scripts/verify-correlation-ids.py --routing
    - name: Unit-test the release train (no network)
      if: ${{ !cancelled() }}
      run: python3 -m unittest discover -s scripts -p test_release_train.py -v
    - name: Verify Docker Model Runner and mock overrides
      if: ${{ !cancelled() }}
      run: bash ./scripts/verify-ollama-config.sh
    - name: Test Docker Model Runner adapter
      if: ${{ !cancelled() }}
      run: python3 -m unittest ollama-dmr-adapter/test_adapter.py
    - name: Verify Java certificate mitigation in every profile
      if: ${{ !cancelled() }}
      run: python3 scripts/verify-java-security.py
    - name: Verify immutable first-party image set
      if: ${{ !cancelled() }}
      run: python3 scripts/verify-release-images.py
    - name: Verify all remotely pulled images are immutable
      if: ${{ !cancelled() }}
      run: python3 scripts/verify-image-pins.py
    # The virtual environment holds only the pinned ansible-core; it is tied to
    # the runner's Python, so that version is part of the key. The collections
    # are not pinned and are installed fresh.
    - name: Read the runner's Python version
      id: python
      if: ${{ !cancelled() }}
      run: echo "version=$(python3 -c 'import platform; print(platform.python_version())')" >> "$GITHUB_OUTPUT"
    - name: Restore the ansible-core virtual environment
      id: ansible-venv
      if: ${{ !cancelled() }}
      uses: actions/cache@v6.1.0
      with:
        path: /tmp/ansible-venv
        key: ansible-venv-${{ runner.os }}-${{ runner.arch }}-py${{ steps.python.outputs.version }}-core${{ env.ANSIBLE_CORE_VERSION }}
    - name: Install ansible-core
      if: ${{ !cancelled() && steps.ansible-venv.outputs.cache-hit != 'true' }}
      run: |
        python3 -m venv /tmp/ansible-venv
        /tmp/ansible-venv/bin/pip install --quiet "ansible-core==$ANSIBLE_CORE_VERSION"
    - name: Install the deploy collections
      if: ${{ !cancelled() }}
      run: /tmp/ansible-venv/bin/ansible-galaxy collection install -r ansible/requirements.yml
    - name: Syntax-check every playbook
      if: ${{ !cancelled() }}
      working-directory: ansible
      run: |
        for playbook in playbooks/*.yml tests/*.yml; do
          /tmp/ansible-venv/bin/ansible-playbook --syntax-check "$playbook"
        done
    - name: Mirror asset directories against fixtures (prune deleted files, keep runtime files)
      if: ${{ !cancelled() }}
      run: PATH="/tmp/ansible-venv/bin:$PATH" python3 scripts/verify-asset-mirror.py

  runDocker:
    needs: changes
    if: needs.changes.outputs.stack == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Build and run Docker Compose
      run: USE_OLLAMA_MOCK=true bash ./run-docker-compose.sh

  # The published lightweight compatibility set with the local monitoring
  # overlay (-f docker-compose.monitoring.yml): one start serves the feature
  # smoke test and the Grafana and Prometheus checks. The full profile gets the
  # overlay through run-docker-compose.sh in runDocker; verifyEventBroker starts
  # the lightweight profile without it.
  verifyLightweight:
    needs: changes
    if: needs.changes.outputs.stack == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Run published lightweight compatibility set with the monitoring overlay
      shell: bash
      run: |
        set -Eeuo pipefail
        compose=(docker compose -f lightweight-docker-compose.yml -f docker-compose.monitoring.yml)
        cleanup() {
          result=$?
          if [[ $result -ne 0 ]]; then
            "${compose[@]}" ps --all
            "${compose[@]}" logs --no-color --tail=200
          fi
          "${compose[@]}" down --volumes --remove-orphans
          exit "$result"
        }
        trap cleanup EXIT

        docker compose -f lightweight-docker-compose.yml config --quiet
        "${compose[@]}" config --quiet
        # Pull every published image fresh, but never look up the locally built
        # docs image in a registry (its name is local-only).
        "${compose[@]}" pull --ignore-buildable
        "${compose[@]}" up -d --wait --wait-timeout 300
        curl --fail --silent --show-error http://127.0.0.1:8081/login >/dev/null
        curl --fail --silent --show-error http://127.0.0.1:8081/docs/ | grep -F 'Awesome LocalStack Wiki' >/dev/null
        curl --fail --silent --show-error http://127.0.0.1:8081/v3/api-docs >/dev/null
        # warehouse-, payment- and notification-service through the gateway (up --wait
        # already required their healthchecks and the postgres-roles one-shot to pass).
        curl --fail --silent --show-error http://127.0.0.1:8081/warehouse/v3/api-docs >/dev/null
        curl --fail --silent --show-error http://127.0.0.1:8081/payment/v3/api-docs >/dev/null
        curl --fail --silent --show-error http://127.0.0.1:8081/notification/v3/api-docs >/dev/null
        curl --fail --silent --show-error --request POST http://127.0.0.1:11434/api/generate \
          --header 'Content-Type: application/json' \
          --data '{"model":"qwen3.5:2b","prompt":"Provide a motivational quote","stream":false}' \
          | grep -F '"done":true' >/dev/null
        # End-to-end checks of the commerce features (search, VAT, payments, event-feed
        # refunds, webhooks, gift cards, simulated carrier) with the demo accounts.
        scripts/smoke-features.sh http://127.0.0.1:8081 full
        # Grafana with every dashboard and all Prometheus targets UP, on the
        # stack that is already running (this step's trap tears it down).
        KEEP_RUNNING=true bash ./scripts/verify-monitoring-overlay.sh lightweight-docker-compose.yml
        # The gateway re-resolves upstreams (Docker DNS, cached up to 10 s): after
        # recreating the backend alone it must reach the new container without a restart.
        "${compose[@]}" up -d --force-recreate --no-deps --wait backend
        for attempt in $(seq 1 15); do
          if curl --fail --silent --request POST http://127.0.0.1:8081/api/v1/users/signin \
            --header 'Content-Type: application/json' --data '{"username":"client","password":"client"}' >/dev/null; then
            echo "gateway reached the recreated backend after $attempt attempt(s)"; break
          fi
          [ "$attempt" -lt 15 ] || { echo "gateway still fails 30 s after the backend was recreated" >&2; exit 1; }
          sleep 2
        done

  verifyEventBroker:
    needs: changes
    if: needs.changes.outputs.stack == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7.0.1
    # The broker transport (docs/EVENT_BROKER_CONTRACT.md) on lightweight +
    # docker-compose.broker.yml + the chaos overlay: delivery through Artemis,
    # dead-lettering and redrive, a consumer's backlog, the relay's backlog.
    - name: Run the lightweight profile with the broker transport
      run: bash ./scripts/verify-event-broker.sh

  verifyDocsSite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7.0.1
    # The image build runs `mkdocs build --strict`: broken links and anchors fail it.
    - name: Build the docs image in strict mode and smoke-test it
      shell: bash
      run: |
        set -Eeuo pipefail
        docker build --build-context repo-docs=docs -t awesome-localstack/docs:local docs-site
        docker run -d --name docs-smoke --memory 32m -p 127.0.0.1:8090:80 awesome-localstack/docs:local
        trap 'docker logs docs-smoke || true; docker rm -f docs-smoke >/dev/null' EXIT
        for _ in $(seq 1 30); do
          curl --fail --silent --output /dev/null http://127.0.0.1:8090/docs/ && break
          sleep 1
        done
        curl --fail --silent --show-error http://127.0.0.1:8090/docs/ | grep -F 'Awesome LocalStack Wiki' >/dev/null
        curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8090/docs/flows/payments/
        curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8090/docs/reference/ANSIBLE/
        curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8090/docs/assets/javascripts/mermaid.min.js
        test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8090/docs/no-such-page/)" = 404
        test "$(curl --silent --output /dev/null --write-out '%{http_code} %header{location}' http://127.0.0.1:8090/docs)" = "301 /docs/"

  runDocker-Jenkins:
    needs: changes
    if: needs.changes.outputs.jenkins == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Build and run Docker Compose CI version
      run: bash ./run-docker-compose-jenkins.sh
