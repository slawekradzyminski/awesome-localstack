version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      non-major-images:
        update-types:
          - minor
          - patch
  - package-ecosystem: docker
    directory: /ollama-dmr-adapter
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      non-major-ollama:
        update-types:
          - minor
          - patch
    ignore:
      # Ollama is pre-1.0, so semver-minor releases can contain runtime-breaking changes.
      - dependency-name: ollama/ollama
        update-types:
          - version-update:semver-minor
      # Keep Python prereleases out of routine maintenance; reconsider when 3.15 is stable.
      - dependency-name: python
        versions:
          - ">= 3.15.0b0, < 3.15.0"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"
