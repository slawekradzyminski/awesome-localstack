version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      non-major-images:
        update-types:
          - minor
          - patch
  - package-ecosystem: docker
    directory: /ollama-dmr-adapter
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      non-major-ollama:
        update-types:
          - minor
          - patch
    ignore:
      # Ollama is pre-1.0, so semver-minor releases can contain runtime-breaking changes.
      - dependency-name: ollama/ollama
        update-types:
          - version-update:semver-minor
      # Keep the runtime on Python 3.14; patch updates remain enabled.
      - dependency-name: python
        update-types:
          - version-update:semver-minor
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"
