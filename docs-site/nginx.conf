# Static documentation server. One worker keeps the container within its
# 32 MiB limit; the gateway proxies /docs/ here unchanged.
worker_processes 1;

error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
  worker_connections 256;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  sendfile on;
  server_tokens off;
  keepalive_timeout 30s;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

  server {
    listen 80;
    server_name _;
    # Relative redirects (/docs/x -> /docs/x/) keep the public scheme and host.
    absolute_redirect off;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = / {
      return 302 /docs/;
    }

    location = /docs {
      return 301 /docs/;
    }

    # Pages revalidate on every view (cheap ETag/304), so a rebuilt wiki shows
    # up immediately instead of after the browser's heuristic cache expires.
    location /docs/ {
      try_files $uri $uri/ =404;
      error_page 404 /docs/404.html;
      add_header Cache-Control "no-cache" always;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location /docs/assets/ {
      expires 7d;
      add_header Cache-Control "public" always;
      add_header X-Content-Type-Options nosniff always;
    }
  }
}
