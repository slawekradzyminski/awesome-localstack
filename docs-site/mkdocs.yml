site_name: Awesome LocalStack Wiki
site_description: How the Awesome Testing training platform works, technically and as a business.
site_url: https://awesome.byst.re/docs/
copyright: Awesome Testing training platform. Built from awesome-localstack/docs-site.

docs_dir: docs
site_dir: site
use_directory_urls: true
strict: true

# Fail the strict build on broken internal links and anchors.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

hooks:
  # Publishes this repository's docs/*.md as the "Reference" section and rewrites
  # their links to files outside docs/ into GitHub links.
  - hooks/repo_docs.py

theme:
  name: material
  # Self-hosted: no Google Fonts request; mermaid is served from this site.
  font: false
  language: en
  icon:
    logo: material/book-open-page-variant
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

# A plain footer link instead of `repo_url`: the theme's repository badge calls
# the GitHub API (and logs a 404 because the repository has no releases).
extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/slawekradzyminski/awesome-localstack
      name: awesome-localstack on GitHub

extra_javascript:
  # Downloaded with a pinned checksum by the Dockerfile; Material uses a global
  # `mermaid` when present instead of fetching it from a CDN.
  - assets/javascripts/mermaid.min.js
  - assets/javascripts/diagram-zoom.js

extra_css:
  - assets/stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
