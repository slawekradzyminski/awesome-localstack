# Correlation IDs (docs-site/docs/operations/tracing.md). A valid incoming
# X-Request-Id (1-128 chars of [A-Za-z0-9._-]) and W3C traceparent are kept;
# anything else is replaced. nginx's $request_id (32 random hex characters)
# is the generated request id and trace id; its last 16 hex characters are the
# generated parent id. All-zero trace and parent ids are invalid (W3C).
map $http_x_request_id $corr_request_id {
  "~^[A-Za-z0-9._-]{1,128}$" $http_x_request_id;
  default $request_id;
}

map $request_id $corr_generated_traceparent {
  "~^[0-9a-f]{16}([0-9a-f]{16})$" "00-$request_id-$1-01";
  default "00-$request_id-0000000000000001-01";
}

map $http_traceparent $corr_traceparent {
  "~^00-(?!0{32})[0-9a-f]{32}-(?!0{16})[0-9a-f]{16}-[0-9a-f]{2}$" $http_traceparent;
  default $corr_generated_traceparent;
}

map $corr_traceparent $corr_trace_id {
  "~^00-([0-9a-f]{32})-" $1;
  default "";
}

# One JSON object per request on stdout (docker compose logs).
log_format gateway_json escape=json '{"time":"$time_iso8601",'
  '"request_id":"$corr_request_id","trace_id":"$corr_trace_id",'
  '"traceparent":"$corr_traceparent","host":"$host",'
  '"remote_addr":"$remote_addr","method":"$request_method","uri":"$uri",'
  '"status":$status,"bytes_sent":$body_bytes_sent,'
  '"request_time":$request_time,"upstream":"$upstream_addr",'
  '"upstream_status":"$upstream_status",'
  '"upstream_connect_time":"$upstream_connect_time",'
  '"upstream_header_time":"$upstream_header_time",'
  '"upstream_response_time":"$upstream_response_time",'
  '"user_agent":"$http_user_agent"}';

server {
  listen 80;
  absolute_redirect off;
  server_name localhost 127.0.0.1;

  client_max_body_size 10m;

  # Correlation IDs: log them, echo X-Request-Id to the client (replacing any
  # copy an upstream sends, so the header appears once), and pass both ids to
  # every upstream (each proxied location sets them, because a location with
  # its own proxy_set_header does not inherit the server's).
  access_log /var/log/nginx/access.log gateway_json;
  proxy_hide_header X-Request-Id;
  add_header X-Request-Id $corr_request_id always;

  # Docker's embedded DNS, for upstreams addressed through variables.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $warehouse_upstream http://warehouse-service:4003;
  set $payment_upstream http://payment-service:4004;
  set $docs_upstream http://docs:80;

  location /api/v1/ws-traffic {
    proxy_pass http://backend:4001;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Request-Id $corr_request_id;
    proxy_set_header traceparent $corr_traceparent;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  # warehouse-service owns fulfilment endpoints. Exact and prefix locations
  # below are longer than the generic /api/v1/ prefix, and the regex wins over
  # that prefix, so these requests never reach the backend. The upstream is a
  # variable resolved at request time, so the gateway still starts (and the
  # backend keeps serving) when warehouse-service is absent or restarting.
  location /api/v1/warehouse/ {
    proxy_pass $warehouse_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Request-Id $corr_request_id;
    proxy_set_header traceparent $corr_traceparent;
  }

  location = /api/v1/returns {
    proxy_pass $warehouse_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Request-Id $corr_request_id;
    proxy_set_header traceparent $corr_traceparent;
  }

  location /api/v1/returns/ {
    proxy_pass $warehouse_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Request-Id $corr_request_id;
    proxy_set_header traceparent $corr_traceparent;
  }

  location = /api/v1/admin/returns {
    proxy_pass $warehouse_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Request-Id $corr_request_id;
    proxy_set_header traceparent $corr_traceparent;
  }

  location /api/v1/admin/returns/ {
    proxy_pass $warehouse_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Request-Id $corr_request_id;
    proxy_set_header traceparent $corr_traceparent;
  }

  location = /api/v1/admin/suppliers {
    proxy_pass $warehouse_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Request-Id $corr_request_id;
    proxy_set_header traceparent $corr_traceparent;
  }

  location /api/v1/admin/suppliers/ {
    proxy_pass $warehouse_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Request-Id $corr_request_id;
    proxy_set_header traceparent $corr_traceparent;
  }

  location = /api/v1/admin/purchase-orders {
    proxy_pass $warehouse_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Request-Id $corr_request_id;
    proxy_set_header traceparent $corr_traceparent;
  }

  location /api/v1/admin/purchase-orders/ {
    proxy_pass $warehouse_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Request-Id $corr_request_id;
    proxy_set_header traceparent $corr_traceparent;
  }

  location = /api/v1/admin/inventory/reorder-suggestions {
    proxy_pass $warehouse_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Request-Id $corr_request_id;
    proxy_set_header traceparent $corr_traceparent;
  }

  location ~ ^/api/v1/orders/\d+/(shipment|shipment/tracking|returns)$ {
    proxy_pass $warehouse_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Request-Id $corr_request_id;
    proxy_set_header traceparent $corr_traceparent;
  }

  # Public shipment tracking by tracking number (no authentication).
  location /api/v1/tracking/ {
    proxy_pass $warehouse_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Request-Id $corr_request_id;
    proxy_set_header traceparent $corr_traceparent;
  }

  # warehouse-service OpenAPI; /warehouse itself stays a frontend route.
  location ^~ /warehouse/v3/api-docs {
    rewrite ^/warehouse(/v3/api-docs.*)$ $1 break;
    proxy_pass $warehouse_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Request-Id $corr_request_id;
    proxy_set_header traceparent $corr_traceparent;
  }

  # payment-service owns card payments. Same rules as the warehouse
  # locations: longer than /api/v1/ or a regex, so the backend never sees
  # them, and a variable upstream so the gateway starts without it.
  location = /api/v1/payments {
    proxy_pass $payment_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Request-Id $corr_request_id;
    proxy_set_header traceparent $corr_traceparent;
  }

  location /api/v1/payments/ {
    proxy_pass $payment_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Request-Id $corr_request_id;
    proxy_set_header traceparent $corr_traceparent;
  }

  location = /api/v1/admin/payments {
    proxy_pass $payment_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Request-Id $corr_request_id;
    proxy_set_header traceparent $corr_traceparent;
  }

  location ~ ^/api/v1/orders/\d+/payments$ {
    proxy_pass $payment_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Request-Id $corr_request_id;
    proxy_set_header traceparent $corr_traceparent;
  }

  # payment-service OpenAPI ("Payment service" in the backend's Swagger UI).
  location ^~ /payment/v3/api-docs {
    rewrite ^/payment(/v3/api-docs.*)$ $1 break;
    proxy_pass $payment_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Request-Id $corr_request_id;
    proxy_set_header traceparent $corr_traceparent;
  }

  # Service-to-service API (X-Service-Token). Never expose it publicly.
  location /internal/ {
    return 404;
  }

  location /api/v1/ {
    proxy_pass http://backend:4001;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Request-Id $corr_request_id;
    proxy_set_header traceparent $corr_traceparent;
  }

  location /swagger-ui/ {
    proxy_pass http://backend:4001;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Request-Id $corr_request_id;
    proxy_set_header traceparent $corr_traceparent;
  }

  location /v3/api-docs {
    proxy_pass http://backend:4001;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Request-Id $corr_request_id;
    proxy_set_header traceparent $corr_traceparent;
  }

  location /actuator/ {
    proxy_pass http://backend:4001;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Request-Id $corr_request_id;
    proxy_set_header traceparent $corr_traceparent;
  }

  location /images/ {
    alias /usr/share/nginx/html/images/;
    try_files $uri =404;
    access_log off;
  }

  location /branding/ {
    alias /usr/share/nginx/html/branding/;
    try_files $uri =404;
    access_log off;
  }

  # Documentation wiki (docs container). Variable upstream like the
  # warehouse and payment locations: the gateway starts without it.
  location = /docs {
    absolute_redirect off;
    return 301 /docs/;
  }

  location /docs/ {
    proxy_pass $docs_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Request-Id $corr_request_id;
    proxy_set_header traceparent $corr_traceparent;
  }

  location / {
    proxy_pass http://frontend:80;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Request-Id $corr_request_id;
    proxy_set_header traceparent $corr_traceparent;
  }
}
