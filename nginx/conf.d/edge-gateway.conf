# Mikrus terminates the public HTTPS path before forwarding requests to this
# IPv6 listener. Its proxy range is documented at:
# https://wiki.mikr.us/nginx_ograniczenie_dostepu_po_ip/
#
# Only that range may supply X-Forwarded-For. Requests arriving directly at
# the origin keep their socket address, so a caller cannot spoof the address
# used by backend rate limiting.
set_real_ip_from 2a01:4f9::/32;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Correlation IDs (docs-site/docs/operations/tracing.md). A valid incoming
# X-Request-Id (1-128 chars of [A-Za-z0-9._-]) and W3C traceparent are kept;
# anything else is replaced. nginx's $request_id (32 random hex characters)
# is the generated request id and trace id; its last 16 hex characters are the
# generated parent id. All-zero trace and parent ids are invalid (W3C).
map $http_x_request_id $corr_request_id {
  "~^[A-Za-z0-9._-]{1,128}$" $http_x_request_id;
  default $request_id;
}

map $request_id $corr_generated_traceparent {
  "~^[0-9a-f]{16}([0-9a-f]{16})$" "00-$request_id-$1-01";
  default "00-$request_id-0000000000000001-01";
}

map $http_traceparent $corr_traceparent {
  "~^00-(?!0{32})[0-9a-f]{32}-(?!0{16})[0-9a-f]{16}-[0-9a-f]{2}$" $http_traceparent;
  default $corr_generated_traceparent;
}

map $corr_traceparent $corr_trace_id {
  "~^00-([0-9a-f]{32})-" $1;
  default "";
}

# One JSON object per request on stdout (docker compose logs).
log_format edge_json escape=json '{"time":"$time_iso8601",'
  '"request_id":"$corr_request_id","trace_id":"$corr_trace_id",'
  '"traceparent":"$corr_traceparent","host":"$host",'
  '"remote_addr":"$remote_addr","method":"$request_method","uri":"$uri",'
  '"status":$status,"bytes_sent":$body_bytes_sent,'
  '"request_time":$request_time,"upstream":"$upstream_addr",'
  '"upstream_status":"$upstream_status",'
  '"upstream_connect_time":"$upstream_connect_time",'
  '"upstream_header_time":"$upstream_header_time",'
  '"upstream_response_time":"$upstream_response_time",'
  '"user_agent":"$http_user_agent"}';

map $http_upgrade $edge_connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80 default_server;
  listen [::]:80 default_server ipv6only=on;
  server_name _;

  client_max_body_size 10m;

  # Correlation IDs: log them, echo X-Request-Id to the client (replacing any
  # copy an upstream sends, so the header appears once), and pass both ids to
  # every upstream (each proxied location sets them, because a location with
  # its own proxy_set_header does not inherit the server's).
  access_log /var/log/nginx/access.log edge_json;
  proxy_hide_header X-Request-Id;
  add_header X-Request-Id $corr_request_id always;

  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Request-Id $corr_request_id;
    proxy_set_header traceparent $corr_traceparent;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $edge_connection_upgrade;
  }
}
