services:
  backend:
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    models: !reset []
    depends_on: !override
      - activemq
      - keycloak
      - ollama
      - postgres

  ollama-dmr-adapter:
    profiles:
      - dmr

  ollama:
    image: slawekradzyminski/ollama-mock:1.0.8@sha256:9859266fbd274ae3030d3b191fe795de76710c0019ee4c33913658cffc7e712e
    restart: unless-stopped
    ports:
      - "11434:11434"
    networks:
      - my-private-ntwk
