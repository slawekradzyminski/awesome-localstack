services:
  backend:
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    models: !reset []
    # Same conditions as docker-compose.yml with ollama instead of the DMR adapter:
    # the native backend starts in about a second and must wait for a healthy database.
    depends_on: !override
      activemq:
        condition: service_started
      ollama:
        condition: service_started
      postgres:
        condition: service_healthy

  ollama-dmr-adapter:
    profiles:
      - dmr

  ollama:
    image: slawekradzyminski/ollama-mock:1.0.12@sha256:ee8a22bbc6b0f00959cf751e6f78d523fcc74eb32759ead0b9b274dc098d310f
    restart: unless-stopped
    ports:
      - "11434:11434"
    networks:
      - my-private-ntwk
    volumes:
      - type: bind
        source: ./security/java/blocked-2596bb6dda83c66d96c5a252d7b2ae1f24cc1ae3f1890223b4f3591a8d52bf10.certs
        target: /opt/java/openjdk/lib/security/blocked.certs
        read_only: true
        bind:
          create_host_path: false
