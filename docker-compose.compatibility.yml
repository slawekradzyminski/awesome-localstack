# Disposable course-contract test stack. Does not replace any normal profile.
name: awesome-compatibility

x-backend: &backend
  image: ${COMPAT_BACKEND_IMAGE:-slawekradzyminski/backend:3.22.0@sha256:f16bbc2d585f663b2fd7f7f6892d65fe17ae2c1ceb349a4a4d20929e82390399}
  environment: &backend-environment
    SPRING_PROFILES_ACTIVE: local,server
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/testdb
    SPRING_DATASOURCE_USERNAME: postgres
    SPRING_DATASOURCE_PASSWORD: postgres
    PASSWORD_RESET_EXPOSE_TOKEN_IN_RESPONSE: "false"
    OLLAMA_BASE_URL: http://ollama-mock:11434
    SECURITY_RATE_LIMIT_ENABLED: "true"
    SECURITY_RATE_LIMIT_SIGNUP_IP_CAPACITY: "2000"
    SECURITY_RATE_LIMIT_SIGNIN_IP_CAPACITY: "4000"
    SECURITY_RATE_LIMIT_SIGNIN_USERNAME_CAPACITY: "2000"
    SECURITY_RATE_LIMIT_SIGNIN_IP_USERNAME_CAPACITY: "1000"
    SECURITY_RATE_LIMIT_MFA_IP_CAPACITY: "600"
    SECURITY_RATE_LIMIT_MFA_CHALLENGE_CAPACITY: "80"
    SECURITY_RATE_LIMIT_MFA_USER_CAPACITY: "20"
    SECURITY_RATE_LIMIT_PASSWORD_FORGOT_IP_CAPACITY: "2000"
    SECURITY_RATE_LIMIT_PASSWORD_FORGOT_IDENTIFIER_CAPACITY: "20"
    SECURITY_RATE_LIMIT_PASSWORD_RESET_IP_CAPACITY: "2000"
    SECURITY_RATE_LIMIT_REFRESH_IP_CAPACITY: "12000"
    SECURITY_RATE_LIMIT_EMAIL_USER_CAPACITY: "6000"
    SECURITY_RATE_LIMIT_QR_USER_CAPACITY: "12000"
    SECURITY_RATE_LIMIT_OLLAMA_USER_CAPACITY: "4000"
    SECURITY_RATE_LIMIT_OLLAMA_IP_CAPACITY: "4000"
    # warehouse-service owns the stock ledger (backend 3.22.0+): each backend calls
    # its own warehouse with the backend token and accepts its calls with the
    # warehouse token. Older backends ignore WAREHOUSE_URL and BACKEND_SERVICE_TOKEN.
    WAREHOUSE_URL: http://warehouse-service:4003
    WAREHOUSE_SERVICE_TOKEN: compat-warehouse-service-token
    BACKEND_SERVICE_TOKEN: compat-backend-service-token
  command: ["-Xmx512m"]
  mem_limit: 768m
  # Same probe as the image's own HEALTHCHECK: warehouse-service waits for it.
  healthcheck:
    test:
      - CMD
      - bash
      - -ec
      - >-
        exec 3<>/dev/tcp/127.0.0.1/4001;
        printf 'GET /actuator/health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3;
        read -r _ status _ <&3;
        test "$$status" = 200
    interval: 5s
    timeout: 5s
    retries: 60
    start_period: 10s

x-warehouse: &warehouse
  # The stock owner next to each backend (schema and role `warehouse` in that
  # backend's database), prepared by the matching *-postgres-roles one-shot.
  image: ${COMPAT_WAREHOUSE_IMAGE:-slawekradzyminski/warehouse-service:1.6.0@sha256:8cb354517b9408600cca55a1e23e0ff83ada2ade9a0507e8270ff23fc0482ead}
  environment: &warehouse-environment
    SPRING_PROFILES_ACTIVE: docker
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/testdb?currentSchema=warehouse
    SPRING_DATASOURCE_USERNAME: warehouse
    SPRING_DATASOURCE_PASSWORD: compat-warehouse-db-password
    BACKEND_BASE_URL: http://backend:4001
    WAREHOUSE_SERVICE_TOKEN: compat-warehouse-service-token
    BACKEND_SERVICE_TOKEN: compat-backend-service-token
  command: ["-Xmx64m"]
  mem_limit: 160m
  healthcheck:
    test:
      - CMD
      - bash
      - -ec
      - >-
        exec 3<>/dev/tcp/127.0.0.1/4003;
        printf 'GET /actuator/health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3;
        read -r _ status _ <&3;
        test "$$status" = 200
    interval: 5s
    timeout: 5s
    retries: 60
    start_period: 10s

x-postgres-roles: &postgres-roles
  # One-shot: the same postgres/service-roles.sh as every other profile.
  image: postgres:16.14-bookworm@sha256:92620daddcd947f8d5ab5ba66e848702fe443d87fed30c4cea8e389fd78dfc55
  entrypoint: ["bash", "/scripts/service-roles.sh"]
  restart: "no"
  environment: &postgres-roles-environment
    PGHOST: postgres
    PGDATABASE: testdb
    PGUSER: postgres
    PGPASSWORD: postgres
    WAREHOUSE_DB_PASSWORD: compat-warehouse-db-password
    PAYMENT_DB_PASSWORD: compat-payment-db-password
    NOTIFICATION_DB_PASSWORD: compat-notification-db-password
  volumes:
    - ./postgres:/scripts:ro
  mem_limit: 64m

x-postgres: &postgres
  # Disposable tmpfs database per backend, so each compatibility run starts clean.
  image: postgres:16.14-bookworm@sha256:92620daddcd947f8d5ab5ba66e848702fe443d87fed30c4cea8e389fd78dfc55
  environment:
    POSTGRES_DB: testdb
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
  command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=40"]
  tmpfs:
    - /var/lib/postgresql/data
  mem_limit: 256m
  shm_size: 64m
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres -d testdb"]
    interval: 2s
    timeout: 3s
    retries: 30

services:
  backend:
    <<: *backend
    depends_on:
      postgres:
        condition: service_healthy
      ollama-mock:
        condition: service_started
    ports:
      - "127.0.0.1:14001:4001"
  postgres:
    <<: *postgres
  postgres-roles:
    <<: *postgres-roles
    depends_on:
      postgres:
        condition: service_healthy
  # No backend depends_on warehouse: warehouse-service needs the backend's JWKS to
  # start, so it waits for a healthy backend instead.
  warehouse-service:
    <<: *warehouse
    depends_on:
      backend:
        condition: service_healthy
      postgres-roles:
        condition: service_completed_successfully
  admin-backend:
    <<: *backend
    depends_on:
      admin-postgres:
        condition: service_healthy
      ollama-mock:
        condition: service_started
    environment:
      <<: *backend-environment
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://admin-postgres:5432/testdb
      WAREHOUSE_URL: http://admin-warehouse-service:4003
      APP_TRAFFIC_OBFUSCATE_AUTHORIZATION: "true"
      APP_TRAFFIC_OBFUSCATE_EMAILS: "true"
      APP_TRAFFIC_OBFUSCATE_SENSITIVE_BODY_FIELDS: "true"
    ports:
      - "127.0.0.1:14002:4001"
  admin-postgres:
    <<: *postgres
  admin-postgres-roles:
    <<: *postgres-roles
    environment:
      <<: *postgres-roles-environment
      PGHOST: admin-postgres
    depends_on:
      admin-postgres:
        condition: service_healthy
  admin-warehouse-service:
    <<: *warehouse
    environment:
      <<: *warehouse-environment
      SPRING_DATASOURCE_URL: jdbc:postgresql://admin-postgres:5432/testdb?currentSchema=warehouse
      BACKEND_BASE_URL: http://admin-backend:4001
    depends_on:
      admin-backend:
        condition: service_healthy
      admin-postgres-roles:
        condition: service_completed_successfully
  ollama-mock:
    image: slawekradzyminski/ollama-mock:1.0.13@sha256:7e3ea7b3c6774c38e81726e64e47323159cea53ce5777ab35754a0e5a9b4ef5e
    volumes:
      - type: bind
        source: ./security/java/blocked-2596bb6dda83c66d96c5a252d7b2ae1f24cc1ae3f1890223b4f3591a8d52bf10.certs
        target: /opt/java/openjdk/lib/security/blocked.certs
        read_only: true
        bind:
          create_host_path: false

  frontend:
    profiles: [graphql-preview]
    image: slawekradzyminski/frontend:3.15.0@sha256:7640d1625b460b1ad5d19a9a6176444c8d8765a527699140fa6fa81eeac0e325
  gateway:
    profiles: [graphql-preview]
    image: nginx:1.31.3-trixie@sha256:5a88c9c45479443d7be2eadc894b4ed0a9801bae03d97a5760ae13b5c2005942
    depends_on:
      - backend
      - frontend
    ports:
      - "127.0.0.1:14081:80"
    volumes:
      - ./nginx/conf.d/lightweight-app-gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/conf.d/header-buffers.conf:/etc/nginx/conf.d/header-buffers.conf:ro
      - ./images:/usr/share/nginx/html/images:ro
      - ./branding:/usr/share/nginx/html/branding:ro
