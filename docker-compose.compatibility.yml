# Disposable course-contract test stack. Does not replace any normal profile.
name: awesome-compatibility

x-backend: &backend
  image: ${COMPAT_BACKEND_IMAGE:-slawekradzyminski/backend:3.20.1@sha256:a47d14898c727aa64374efeb405ac1aea95fe0d047cfbf3b160ea89f46a4de52}
  environment: &backend-environment
    SPRING_PROFILES_ACTIVE: local,server
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/testdb
    SPRING_DATASOURCE_USERNAME: postgres
    SPRING_DATASOURCE_PASSWORD: postgres
    PASSWORD_RESET_EXPOSE_TOKEN_IN_RESPONSE: "false"
    OLLAMA_BASE_URL: http://ollama-mock:11434
    SECURITY_RATE_LIMIT_ENABLED: "true"
    SECURITY_RATE_LIMIT_SIGNUP_IP_CAPACITY: "2000"
    SECURITY_RATE_LIMIT_SIGNIN_IP_CAPACITY: "4000"
    SECURITY_RATE_LIMIT_SIGNIN_USERNAME_CAPACITY: "2000"
    SECURITY_RATE_LIMIT_SIGNIN_IP_USERNAME_CAPACITY: "1000"
    SECURITY_RATE_LIMIT_MFA_IP_CAPACITY: "600"
    SECURITY_RATE_LIMIT_MFA_CHALLENGE_CAPACITY: "80"
    SECURITY_RATE_LIMIT_MFA_USER_CAPACITY: "20"
    SECURITY_RATE_LIMIT_PASSWORD_FORGOT_IP_CAPACITY: "2000"
    SECURITY_RATE_LIMIT_PASSWORD_FORGOT_IDENTIFIER_CAPACITY: "20"
    SECURITY_RATE_LIMIT_PASSWORD_RESET_IP_CAPACITY: "2000"
    SECURITY_RATE_LIMIT_REFRESH_IP_CAPACITY: "12000"
    SECURITY_RATE_LIMIT_EMAIL_USER_CAPACITY: "6000"
    SECURITY_RATE_LIMIT_QR_USER_CAPACITY: "12000"
    SECURITY_RATE_LIMIT_OLLAMA_USER_CAPACITY: "4000"
    SECURITY_RATE_LIMIT_OLLAMA_IP_CAPACITY: "4000"
  command: ["-Xmx512m"]
  mem_limit: 768m

x-postgres: &postgres
  # Disposable tmpfs database per backend, so each compatibility run starts clean.
  image: postgres:16.14-bookworm@sha256:92620daddcd947f8d5ab5ba66e848702fe443d87fed30c4cea8e389fd78dfc55
  environment:
    POSTGRES_DB: testdb
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
  command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=40"]
  tmpfs:
    - /var/lib/postgresql/data
  mem_limit: 256m
  shm_size: 64m
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres -d testdb"]
    interval: 2s
    timeout: 3s
    retries: 30

services:
  backend:
    <<: *backend
    depends_on:
      postgres:
        condition: service_healthy
      ollama-mock:
        condition: service_started
    ports:
      - "127.0.0.1:14001:4001"
  postgres:
    <<: *postgres
  admin-backend:
    <<: *backend
    depends_on:
      admin-postgres:
        condition: service_healthy
      ollama-mock:
        condition: service_started
    environment:
      <<: *backend-environment
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://admin-postgres:5432/testdb
      APP_TRAFFIC_OBFUSCATE_AUTHORIZATION: "true"
      APP_TRAFFIC_OBFUSCATE_EMAILS: "true"
      APP_TRAFFIC_OBFUSCATE_SENSITIVE_BODY_FIELDS: "true"
    ports:
      - "127.0.0.1:14002:4001"
  admin-postgres:
    <<: *postgres
  ollama-mock:
    image: slawekradzyminski/ollama-mock:1.0.13@sha256:7e3ea7b3c6774c38e81726e64e47323159cea53ce5777ab35754a0e5a9b4ef5e
    volumes:
      - type: bind
        source: ./security/java/blocked-2596bb6dda83c66d96c5a252d7b2ae1f24cc1ae3f1890223b4f3591a8d52bf10.certs
        target: /opt/java/openjdk/lib/security/blocked.certs
        read_only: true
        bind:
          create_host_path: false

  frontend:
    profiles: [graphql-preview]
    image: slawekradzyminski/frontend:3.14.0@sha256:48ebc560e9fc247fe7b4a43249eba25b61a131f8e98b5da29da883d3baa689ea
  gateway:
    profiles: [graphql-preview]
    image: nginx:1.31.3-trixie@sha256:5a88c9c45479443d7be2eadc894b4ed0a9801bae03d97a5760ae13b5c2005942
    depends_on:
      - backend
      - frontend
    ports:
      - "127.0.0.1:14081:80"
    volumes:
      - ./nginx/conf.d/lightweight-app-gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/conf.d/header-buffers.conf:/etc/nginx/conf.d/header-buffers.conf:ro
      - ./images:/usr/share/nginx/html/images:ro
      - ./branding:/usr/share/nginx/html/branding:ro
